name: Архивно копие на базата
on:
  # schedule (Cloudflare):
    # cf-cron: "13 1 * * 1"   # всеки понеделник
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/backup-db.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Размер на архива
        run: du -h backup/* && du -sh backup
      - uses: actions/upload-artifact@v4
        with:
          name: baza-${{ github.run_number }}
          path: backup/
          retention-days: 35
