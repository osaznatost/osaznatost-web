name: АДФИ — доклади от финансови инспекции
on:
  # schedule (Cloudflare):
    # cf-cron: "52 4 * * 2,5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import-adfi.mjs
      - name: Запис
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "osaznatost-bot"; git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/adfi.json
          git diff --cached --quiet && exit 0
          git commit -qm "АДФИ доклади"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
