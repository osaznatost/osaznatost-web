name: Общински съвети (решения)
on:
  schedule:
    - cron: "41 */4 * * *"   # на всеки 4 часа, докато прочете всичко; после само новите
  workflow_dispatch:
    inputs:
      minutes:
        default: "45"
      only:
        default: ""
permissions:
  contents: write
concurrency:
  group: council
  cancel-in-progress: false
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Четене от сайтовете на съветите
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          ONLY: ${{ inputs.only || '' }}
        run: node scripts/import-council-sites.mjs
      - name: Пример
        run: node -e 'const d=require("./data/council/SOF46.json");console.log(JSON.stringify(d.decisions.slice(0,3),null,1).slice(0,3000))' || true
      - name: Запис (data/council не се публикува сам; влиза в сайта при дневното обновяване)
        run: |
          git add data/council
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Общински съвети: още решения"
          git pull --rebase -X theirs
          git push
