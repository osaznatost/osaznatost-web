name: Общински съвети (решения)
on:
  # schedule (Cloudflare):
    # cf-cron: "41 */4 * * *"   # на всеки 4 часа, докато прочете всичко; после само новите
  workflow_dispatch:
    inputs:
      minutes:
        default: "45"
      only:
        default: ""
permissions:
  contents: write
concurrency:
  group: council
  cancel-in-progress: false
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils antiword tesseract-ocr-bul p7zip-full >/dev/null && (sudo apt-get install -y -qq 7zip unrar >/dev/null 2>&1 || true)
      - name: Браузър без екран (за сайтове, които зареждат списъка с JavaScript)
        run: npm i --no-save --no-package-lock --ignore-scripts playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Четене от сайтовете на съветите
        env:
          MINUTES: ${{ inputs.minutes || '38' }}
          ONLY: ${{ inputs.only || '' }}
        run: node scripts/import-council-sites.mjs
      - name: Гласувания от протоколите на заседанията (Бургас и др.)
        env:
          MINUTES: "12"
        run: node scripts/enrich-council-votes.mjs
      - name: Пример
        run: node -e 'const d=require("./data/council/SOF46.json");console.log(JSON.stringify(d.decisions.slice(0,3),null,1).slice(0,3000))' || true
      - name: Запис (data/council не се публикува сам; влиза в сайта при дневното обновяване)
        run: |
          git fetch -q origin main && node scripts/merge-council.mjs origin/main
          git add data/council
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Общински съвети: още решения"
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && break; sleep 10; done
