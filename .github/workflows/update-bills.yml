name: Законопроекти (мотиви, доклади, становища, дебати)
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        default: ""
permissions:
  contents: write
concurrency:
  group: bills
  cancel-in-progress: false
jobs:
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: node scripts/import-bills.mjs
        env:
          MINUTES: "48"
          REFRESH: ${{ inputs.refresh }}
      - run: node scripts/build-bills.mjs
      - name: Запис
        run: |
          git add data/bills-src data/bills.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Законопроекти: обновяване"
          git pull --rebase -X theirs
          git push
