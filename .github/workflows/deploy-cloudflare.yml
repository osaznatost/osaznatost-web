# Качва сайта в Cloudflare Workers (адрес osaznatost.<акаунт>.workers.dev).
# Нужни GitHub secrets (въвежда ги Павлин): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SITE_PASSWORD,
# SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_PUBLISHABLE_KEY; по желание VOTE_PEPPER, RESEND_API_KEY, EMAIL_FROM.
# Данните се обновяват от други работни потоци, които не могат да пуснат този при push, затова има и график.
name: deploy-cloudflare
on:
  push:
    branches: [main]
  # schedule (Cloudflare):
    # cf-cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Проверка на тайните
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          P: ${{ secrets.SITE_PASSWORD }}
        run: |
          [ -n "$T" ] && [ -n "$A" ] || { echo "::error::Липсват CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          # без парола сайтът би станал публичен: не качваме
          [ -n "$P" ] || { echo "::error::Липсва SITE_PASSWORD"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Сглобяване
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/check-parity.mjs && node scripts/build-schedule.mjs && node scripts/build-changes.mjs && npx opennextjs-cloudflare build && node scripts/cf-assets.mjs
      - name: Качване
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cf-kv.mjs && npx wrangler deploy --var BUILD_ID:${{ github.run_id }}
      - name: Тайни на сайта
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VOTE_PEPPER: ${{ secrets.VOTE_PEPPER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        # само непразните; стойностите не се печатат в лога
        run: |
          node -e 'const k=["SITE_PASSWORD","SUPABASE_SECRET_KEY","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY","VOTE_PEPPER","RESEND_API_KEY","EMAIL_FROM","GH_DISPATCH_TOKEN"];const o={};for(const x of k)if(process.env[x])o[x]=process.env[x];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/s.json",JSON.stringify(o))'
          npx wrangler secret bulk "$RUNNER_TEMP/s.json"
          rm -f "$RUNNER_TEMP/s.json"
      - name: Затопляне на кеша (областите и общините се отварят веднага)
        continue-on-error: true
        timeout-minutes: 20
        env:
          PW: ${{ secrets.SITE_PASSWORD }}
        run: |
          sleep 20
          H=$(printf '%s' "$PW" | sha256sum | cut -d' ' -f1)
          B=https://osaznatost.pavlin140.workers.dev
          curl -s -m 60 -H "Cookie: osz_auth=$H" "$B/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | sed "s#^https\?://[^/]*##" \
            | grep -E '^/($|vlast$|porachki$|mesta(/[a-z]{3}(/[a-z]{3}[0-9]{2})?)?$)' | sort -u > paths.txt
          echo "страници: $(wc -l < paths.txt)"
          < paths.txt xargs -P 6 -I{} sh -c 'curl -s -m 60 -o /dev/null -w "%{http_code} %{time_total} {}\n" -H "Cookie: osz_auth='"$H"'" "'"$B"'{}"' | awk '{n++; if($1!=200)bad++; t+=$2} END {print n" затоплени, неуспешни: "bad+0", средно "t/n"s"}'
