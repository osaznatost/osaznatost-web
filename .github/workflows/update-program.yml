name: Програма на парламента

on:
  # schedule (Cloudflare):
    # cf-cron: "17 6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/import-program.mjs]

permissions:
  contents: write

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-program.mjs
      - run: |
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/program.json data/program-history.json
          git commit -m "Програма на Народното събрание" || exit 0
          git pull --rebase
          git push
