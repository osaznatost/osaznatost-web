name: Обновяване на данните

on:
  schedule:
    - cron: "17 4 * * *"   # всеки ден, 06:17 българско време (зимно)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/import-rollcall.mjs, scripts/import-parliament.mjs]

permissions:
  contents: write

jobs:
  parliament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Импорт на гласуванията („Наясно“)
        run: node scripts/import-parliament.mjs
      - name: Допълване от parliament.bg
        run: node scripts/import-rollcall.mjs
      - name: Запис, ако има промяна
        run: |
          git add data/
          if git diff --cached --quiet; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Данни: обновени гласувания в парламента"
          git pull --rebase
          git push
