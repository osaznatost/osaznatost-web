name: Обновяване на данните

on:
  schedule:
    - cron: "17 4 * * *"   # всеки ден, 06:17 българско време (зимно)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/import-rollcall.mjs, scripts/import-parliament.mjs, scripts/import-mps.mjs, scripts/fix-groups.mjs]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  parliament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Импорт на гласуванията („Наясно“)
        run: node scripts/import-parliament.mjs
      - name: Допълване от parliament.bg
        run: |
          npm i --no-save --no-package-lock xlsx@0.18.5
          node scripts/import-rollcall.mjs
      - name: Профили на депутатите
        run: |
          node scripts/import-mps.mjs
          node scripts/import-mp-history.mjs
          node scripts/fix-groups.mjs
      - name: Държавен бюджет (последният приет закон и изпълнението му)
        run: node scripts/import-budget.mjs
      - name: Точност на социологическите агенции
        run: node scripts/import-polls.mjs
      - name: Европейски средства
        run: node scripts/import-funds.mjs
      - name: Решения на общински съвети от сайтовете им (Ботевград)
        run: |
          sudo apt-get install -qq -y poppler-utils >/dev/null 2>&1
          node scripts/import-council-sites.mjs || echo "Сайтовете на съветите не отговарят, продължаваме"
      - name: Хората зад поръчките (OCDS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/import-ocds-people.mjs || echo "ЦАИС ЕОП не отговаря, продължаваме"
      - name: Търговски регистър (от прочетеното)
        run: node scripts/build-tr.mjs
      - name: Местна власт (декларации и общински съвети)
        run: node scripts/import-local.mjs
      - name: Профил на местата (преброяване, карти, държавни инвестиции)
        run: node scripts/import-places.mjs
      - name: Национална класация на риска в поръчките
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/build-risk.mjs
      - name: Запис, ако има промяна
        run: |
          git add data/
          if git diff --cached --quiet; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Данни: дневно обновяване"
          git pull --rebase -X theirs   # при сблъсък печелят току-що изчислените данни
          git push
