name: Обновяване на данните

on:
  schedule:
    - cron: "17 4 * * 1"   # всеки понеделник, 06:17 българско време (зимно)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parliament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Импорт на гласуванията
        run: node scripts/import-parliament.mjs
      - name: Запис, ако има промяна
        run: |
          if git diff --quiet -- data/; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/
          git commit -m "Данни: обновени гласувания в парламента"
          git push
