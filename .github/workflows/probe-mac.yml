name: Проба от България (Mac)
# Ръчна проба на сайтове, които приемат само български IP адреси. Върви на Mac-а на Павлин.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe/mac.mjs
