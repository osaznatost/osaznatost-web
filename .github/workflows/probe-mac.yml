name: Проба от България (Mac)
# Ръчна проба на сайтове, които приемат само български IP адреси. Върви на Mac-а на Павлин.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      # Mac-ът понякога е без мрежа за минута след събуждане — втори опит след пауза.
      - if: steps.co1.outcome == 'failure'
        run: sleep 90
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe/mac.mjs
