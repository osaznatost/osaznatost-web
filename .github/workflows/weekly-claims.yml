name: Седмична проверка на твърдения
on:
  # schedule (Cloudflare):
    # cf-cron: "17 6 * * 1"   # всеки понеделник
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/weekly-claims.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-stale-params.mjs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
