name: Общински съвети от Mac (Благоевград)
# Сайтът с файловете на Общински съвет Благоевград отговаря само на български IP: Mac-ът ги сваля, GitHub ги разчита и записва.
on:
  # schedule (Cloudflare):
    # cf-cron: "23 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: council
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      # Mac-ът понякога е без мрежа за минута след събуждане — втори опит след пауза.
      - if: steps.co1.outcome == 'failure'
        run: sleep 90
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Сваляне на новите файлове
        run: caffeinate -i -s node scripts/fetch-council-mac.mjs
      - uses: actions/upload-artifact@v4
        with: { name: council-files, path: out/, retention-days: 2, if-no-files-found: ignore }
  read:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: council-files, path: out }
        continue-on-error: true
      - run: sudo apt-get install -y -qq poppler-utils antiword tesseract-ocr tesseract-ocr-bul >/dev/null
      - name: Разчитане
        env: { BLG_DIR: out, ONLY: BLG03 }
        run: node scripts/import-council-sites.mjs
      - name: Запис
        run: |
          git add data/council
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Общински съвети: Благоевград"
          git pull --rebase -X theirs
          git push
