name: Общински съвети (гласувания от протоколите)
on:
  # schedule (Cloudflare):
    # cf-cron: "17 2,14 * * *"   # два пъти на ден: дочита гласуванията от протоколите и PDF-ите на решенията
  workflow_dispatch:
    inputs:
      minutes:
        default: "45"
      only:
        default: ""
permissions:
  contents: write
concurrency:
  group: council
  cancel-in-progress: false
jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Гласувания (Бургас, Варна — протоколи; Стара Загора, Русе — PDF на решенията)
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          ONLY: ${{ inputs.only || '' }}
        run: node scripts/enrich-council-votes.mjs
      - name: Запис
        run: |
          git fetch -q origin main && node scripts/merge-council.mjs origin/main
          git add data/council
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Общински съвети: гласувания от протоколите"
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && break; sleep 10; done
