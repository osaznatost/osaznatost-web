name: Lighthouse (локална сборка с данните)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Сборката е само в машината на GitHub и не се публикува; ключът остава в GitHub secrets.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Lighthouse (телефон)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          (npx next start -p 3130 > /tmp/srv.log 2>&1 &) ; sleep 8
          for u in /porachki/dogovor/n~130020522~49850 /mesta/sfo/sfo07; do curl -s -o /dev/null "http://localhost:3130$u"; curl -s -o /dev/null "http://localhost:3130$u"; done
          for u in /mesta/sfo/sfo07 /mesta/sfo/sfo07 /mesta/sfo/sfo07; do
            curl -s -o /tmp/p.html -w 'TIMING %{time_starttransfer} %{time_total} %{size_download}\n' "http://localhost:3130$u"
            python3 -c "import re;h=open('/tmp/p.html',encoding='utf-8').read();print('SECTIONS', [(m.group(1), m.start()) for m in re.finditer(r'id=\"([a-z-]{3,20})\"', h)][:40], len(h))"
            npx -y lighthouse@12 "http://localhost:3130$u" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh.json || true
            node -e "const r=require('/tmp/lh.json');console.log('RESULT', '$u', 'performance', Math.round(r.categories.performance.score*100), 'accessibility', Math.round(r.categories.accessibility.score*100), 'LCP', r.audits['largest-contentful-paint'].displayValue, 'FCP', r.audits['first-contentful-paint'].displayValue, 'TBT', r.audits['total-blocking-time'].displayValue, 'CLS', r.audits['cumulative-layout-shift'].displayValue, 'SI', r.audits['speed-index'].displayValue, 'LCPel', JSON.stringify(r.audits['largest-contentful-paint-element']?.details?.items?.[0]?.items?.[0]?.node?.snippet ?? '').slice(0,200), 'TTFB', r.audits['server-response-time'].displayValue, 'bytes', r.audits['total-byte-weight'].displayValue); console.log('BOOTUP', JSON.stringify((r.audits['bootup-time'].details?.items??[]).slice(0,6).map(i=>[i.url.slice(-60), Math.round(i.total), Math.round(i.scripting)]))); console.log('MAIN', JSON.stringify((r.audits['mainthread-work-breakdown'].details?.items??[]).map(i=>[i.group, Math.round(i.duration)]))); console.log('LONG', JSON.stringify((r.audits['long-tasks']?.details?.items??[]).slice(0,5).map(i=>[String(i.url).slice(-60), Math.round(i.duration), Math.round(i.startTime)]))); console.log('FRAMES', JSON.stringify(r.audits['screenshot-thumbnails'].details.items.map(f=>[f.timing, f.data.length]))); console.log('NET', JSON.stringify(r.audits['network-requests'].details.items.map(i=>[i.url.slice(-40), i.transferSize, Math.round(i.networkEndTime??i.endTime??0)]).slice(0,15))); console.log('SHIFT', JSON.stringify((r.audits['layout-shifts']?.details?.items??[]).slice(0,4).map(i=>[i.node?.snippet?.slice(0,120), i.score])))" || true
          done
