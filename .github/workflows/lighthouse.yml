name: Lighthouse (локална сборка с данните)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Сборката е само в машината на GitHub и не се публикува; ключът остава в GitHub secrets.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Lighthouse (телефон)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          (npx next start -p 3130 > /tmp/srv.log 2>&1 &) ; sleep 8
          for u in /porachki/dogovor/n~130020522~49850 / /parlament/deputat/5221 /mesta/sfo/sfo07; do
            npx -y lighthouse@12 "http://localhost:3130$u" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh.json || true
            node -e "const r=require('/tmp/lh.json');console.log('RESULT', '$u', 'performance', Math.round(r.categories.performance.score*100), 'accessibility', Math.round(r.categories.accessibility.score*100), 'LCP', r.audits['largest-contentful-paint'].displayValue)" || true
          done
