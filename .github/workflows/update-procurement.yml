name: Обновяване на поръчките

on:
  # schedule (Cloudflare):
    # cf-cron: "23 */3 * * *"   # на всеки 3 часа; след наваксване внася само новия ден
  workflow_dispatch:
    inputs:
      from:
        description: "Само за „Какво се промени“: от дата (ГГГГ-ММ-ДД), без запис в базата"
        required: false
  push:
    branches: [main]
    paths: [scripts/import-procurement.mjs, scripts/build-buyers.mjs]

permissions:
  contents: write

concurrency:
  group: procurement
  cancel-in-progress: false

jobs:
  eop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Договори и анекси от ЦАИС ЕОП
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: if [ -n "${{ github.event.inputs.from }}" ]; then CHANGES_ONLY=1 node scripts/import-procurement.mjs "${{ github.event.inputs.from }}"; else node scripts/import-procurement.mjs; fi
      - name: Къде се намира всеки възложител
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        # Пълен преглед на таблицата: веднъж на ден (първото пускане след полунощ UTC), за да пазим дисковия бюджет на базата.
        run: if [ "$(date -u +%H)" -lt 3 ] || [ "${{ github.event_name }}" = push ]; then node scripts/build-buyers.mjs; else echo "Възложителите се преглеждат веднъж на ден"; fi
      - name: Запис на промените
        if: always()
        run: |
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/changes/proc.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Поръчки: какво се промени"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs -q origin main; done
