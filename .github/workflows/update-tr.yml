name: Търговски регистър (фирмите с поръчки)

on:
  schedule:
    - cron: "11 */2 * * *"   # на всеки 2 часа, докато мине през всички фирми; после само обновява
  workflow_dispatch:
    inputs:
      minutes:
        default: "50"

permissions:
  contents: write

concurrency:
  group: tr
  cancel-in-progress: false

jobs:
  tr:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Четене от Агенция по вписванията
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MINUTES: ${{ inputs.minutes || '50' }}
        run: python3 scripts/import-tr.py
      - name: Запис (в scripts/, без публикуване на сайта)
        run: |
          git add scripts/tr-cache
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Търговски регистър: още фирми"
          git pull --rebase
          git push
