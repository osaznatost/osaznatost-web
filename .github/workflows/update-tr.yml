name: Търговски регистър (фирмите с поръчки)

on:
  # schedule (Cloudflare):
    # cf-cron: "11 */6 * * *"   # на всеки 6 часа по ~5,5 часа (агенцията допуска ~1 заявка на 5 с), докато мине през всички фирми
  workflow_dispatch:
    inputs:
      minutes:
        default: "330"
      eiks:
        description: "Само тези ЕИК (със запетая)"
        default: ""

permissions:
  contents: write

concurrency:
  group: tr
  cancel-in-progress: false

jobs:
  tr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Четене от Агенция по вписванията
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MINUTES: ${{ inputs.minutes || '330' }}
          ONLY_EIKS: ${{ inputs.eiks || '' }}
        run: python3 scripts/import-tr.py
      - name: Запис (в scripts/, без публикуване на сайта)
        if: always()
        run: |
          rm -rf /tmp/mine && cp -r scripts/tr-cache /tmp/mine && (cp scripts/tr-suppliers.json /tmp/sup.json 2>/dev/null || true)
          git fetch -q origin main && git reset -q --hard origin/main
          node scripts/merge-tr-cache.mjs /tmp/mine scripts/tr-cache
          [ -f /tmp/sup.json ] && cp /tmp/sup.json scripts/tr-suppliers.json
          git add scripts/tr-cache scripts/tr-suppliers.json 2>/dev/null || git add scripts/tr-cache
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Търговски регистър: още фирми"
          git push || (git fetch -q origin main && git rebase -X theirs origin/main && git push)
