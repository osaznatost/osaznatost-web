name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p /tmp/r && cd /tmp/r && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/probe/render.mjs /tmp/r/ && node render.mjs "https://www.svilengrad.bg/bg/resheniya-na-obshtinski-savet" "https://www.popovo.bg/bg/obs-menu/reshenia-obs-new/reshenia-obs-2023-2027-.html" "https://www.gabrovo.bg/bg/page/274" "https://obs.kazanlak.bg/r-6-1.html" "https://www.karlovo.bg/section-493-content.html" "https://os-nessebar.eu/resheniya" "https://www.balchik.bg/bg/posts/index/42" "https://www.aksakovo.bg/section-4167-content.html"
