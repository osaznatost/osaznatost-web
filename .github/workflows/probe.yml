name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pip install -q python-docx >/dev/null 2>&1
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://obs.pleven.bg/uploads/posts/protokol-51_.pdf -o p.pdf; pdftotext -layout p.pdf p.txt; wc -c p.txt
          python3 -c "
          import re;t=open('p.txt').read()
          ms=[m.start() for m in re.finditer(r'РЕШЕНИЕ\s*№|Р Е Ш Е Н И Е',t)]
          print('N',len(ms))
          for i in ms[2:4]: print('PL>>>',re.sub(r'[ \t]+',' ',t[i-1200:i+200]))
          "
          curl -sL -A "$UA" https://obs.sliven.bg/protokoli-ot-zasedaniyata | grep -oE 'href="[^"]+"[^>]*>[^<]{0,90}' | grep -iE 'uploads|протокол' | head -8
