name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 60 -A "$UA" https://www.dm-drogeriemarkt.bg/product-sitemap.xml -o sm.xml; echo "BG products: $(grep -c '<loc>' sm.xml)"
          for c in BG DE AT RO HR; do curl -s -m 25 -A "$UA" -o d.json -w "## $c %{http_code} %{size_download}\n" "https://products.dm.de/product/$c/products/detail/dan/1913393"; python3 -c "
          import json;d=json.load(open('d.json'))
          def f(o,p=''):
            if isinstance(o,dict):
              for k,v in o.items():
                if any(x in k.lower() for x in ['price','gtin','title','name','brand','currency','content','unit']) and not isinstance(v,(dict,list)): print(' ',p+k,'=',str(v)[:80])
                f(v,p+k+'.')
            elif isinstance(o,list):
              for i,v in enumerate(o[:3]): f(v,p+str(i)+'.')
          f(d)" 2>&1 | head -25; done
