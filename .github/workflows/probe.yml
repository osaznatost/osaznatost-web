name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq antiword poppler-utils >/dev/null
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -m 60 -A "$UA" -o p.html https://vidinobs.com/resheniq
          python3 -c "
          import re;s=open('p.html',encoding='utf8').read()
          for m in re.finditer(r'(Решени[ея][^<]{0,120}?Протокол[^<]{0,60})[\s\S]{0,800}?href=\"(https://vidinobs.com/storage/protocols/[^\"]+)\"', s): print('## IT', re.sub(r'\s+',' ',m.group(1)), m.group(2))
          " | head -40
          F=$(python3 -c "
          import re;s=open('p.html',encoding='utf8').read();print(re.findall(r'href=\"(https://vidinobs.com/storage/protocols/[^\"]+\.doc)\"',s)[-1])")
          curl -sL -m 60 -A "$UA" -o d.doc "$F"; antiword -m UTF-8.txt d.doc > d.txt 2>/dev/null || antiword d.doc > d.txt; wc -c d.txt
          head -c 5000 d.txt | sed 's/^/## T /'
