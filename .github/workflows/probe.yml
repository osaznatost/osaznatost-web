name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 20 -A "$UA" https://www.dm-drogeriemarkt.bg/robots.txt; echo; curl -s -m 20 -A "$UA" https://www.dm.de/robots.txt | head -30; echo
          for c in bg de at ro hr; do
            curl -s -m 25 -A "$UA" -H 'Accept: application/json' -o s.json -w "## $c %{http_code} %{size_download}\n" "https://product-search.services.dmtech.com/$c/search?query=balea&pageSize=3&currentPage=0"
            head -c 700 s.json; echo
          done
