name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils antiword tesseract-ocr-bul p7zip-full >/dev/null 2>&1
      - run: |
          for c in $CODES; do rm -f data/council/$c.json; ONLY=$c MINUTES=$MIN node scripts/import-council-sites.mjs 2>&1 | tail -2; done
          python3 probe/stat.py $CODES
        env:
          CODES: "HKV32"
          MIN: "2"
