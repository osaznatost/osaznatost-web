name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > x.py <<'X'
          import re,sys,urllib.request
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          g=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=40).read().decode("utf-8","ignore")
          for u in sys.argv[1:]:
            h=g(u); print("##",u,len(h))
            for a,t in re.findall(r'<a\s[^>]*?href="([^"]+)"[^>]*>([\s\S]{0,200}?)</a>',h):
              t=re.sub(r'<[^>]+>|\s+',' ',t).strip()
              if re.search(r'202[3-6]|сеси|заседан|session|Решени|reshen|\.pdf|\.doc|page',a+" "+t,re.I): print("  L",a[:150],"|",t[:80])
          X
          python3 x.py https://www.samokov.bg/bg/web/council/sessions-2023-2027 2>&1 | head -60
