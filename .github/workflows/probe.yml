name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          F='(?i)решени|reshen|resheni|obs|общински.съвет|obshtinski'
          python3 probe/all.py "https://www.velingrad.bg|$F" "https://www.troyan.bg|$F" "https://panagyurishte.bg/obsthinski-savet/|$F" "https://www.harmanli.bg|$F" "https://www.svilengrad.bg|$F" "https://www.pomorie.bg|$F" "http://os-nessebar.eu/|$F" "https://www.chervenbryag.bg|$F" "https://www.sandanski.bg|$F" "https://www.bansko.bg|$F" "https://www.rakovski.bg|$F" "https://www.popovo.bg|$F" "https://www.aksakovo.bg|$F" "https://www.balchik.bg|$F" "https://www.momchilgrad.bg/obshtinski-savet.html|$F" "https://www.kozloduy.bg|$F" "https://www.gotsedelchev.bg|$F" 2>&1 | cut -c1-200
