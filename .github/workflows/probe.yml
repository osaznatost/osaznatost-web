name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: { PW: "${{ secrets.SITE_PASSWORD }}" }
        run: |
          C="osz_auth=$(printf %s "$PW" | sha256sum | cut -d' ' -f1)"
          for e in 831652485; do curl -s -m 200 -w " %{http_code} %{time_total}s\n" -H "Cookie: $C" "https://osaznatost.pavlin140.workers.dev/api/firm-signals?eik=$e"; done
