name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for S in "https://www.obs-pernik.bg|" "https://www.dimovo.bg|" "https://www.ivaylovgrad.bg|" "https://www.maglizh.bg|"; do B=${S%|}
            echo "## $B"
            curl -s -m 40 -A "$UA" "$B/wp-json/wp/v2/categories?per_page=100&search=%D1%80%D0%B5%D1%88%D0%B5%D0%BD%D0%B8" | python3 -c "import json,sys;[print('  C',c['id'],c['name'],c['count']) for c in json.load(sys.stdin)]" 
          done
          curl -s -m 40 -A "$UA" "https://www.obs-pernik.bg/wp-json/wp/v2/posts?per_page=2&search=%D0%A0%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D0%B5" | python3 -c "
          import json,sys
          for p in json.load(sys.stdin): print('  P',p['title']['rendered'],p['categories'],p['content']['rendered'][:1500])"
          curl -s -m 40 -A "$UA" "https://www.dimovo.bg/wp-json/wp/v2/posts?per_page=1&categories=28" | python3 -c "
          import json,sys
          for p in json.load(sys.stdin): print('  D',p['title']['rendered'],p['content']['rendered'][:1200])"
