name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 167606 167651 166934; do
            curl -s -m 60 -H "Origin: https://www.parliament.bg" -H "Referer: https://www.parliament.bg/bg/bills" -H "Accept: application/json" "https://www.parliament.bg/api/v1/bill/$id" > b.json
            node -e 'const b=require("./b.json");console.log("## '$id'",JSON.stringify(b.file_list),Object.keys(b).filter(k=>/file|list/.test(k)).join(","))' | cut -c1-900
          done
          F=$(node -e 'const b=require("./b.json");console.log(b.file_list?.[0]?.FILENAME??"")')
          echo "## F $F"
