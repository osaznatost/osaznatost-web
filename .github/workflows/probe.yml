name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
      - run: node probe/around.mjs "https://obs.kyustendil.bg/uploads/mandat2023-2027/protokoli/40_Prototkol_40_29.10.2026%20.pdf" "Р\\s*Е\\s*Ш\\s*Е\\s*Н\\s*И\\s*Е\\s*№" 2 900 200
