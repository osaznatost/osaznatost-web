name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 60 https://assets.dm.de/product/2026.1124.1610/product-dm.min.js -o p.js; wc -c p.js
          grep -oE '.{0,80}(/products/|/product/|detail/|availability|/prices?)[^"`]{0,80}' p.js | sort -u | head -40
