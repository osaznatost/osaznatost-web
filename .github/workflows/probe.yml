name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -q poppler-utils >/dev/null 2>&1
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" -m 120 "https://obs.kazanlak.bg/common/docs/2026-10/Protokol_67_sait.pdf" -o p.pdf -w "GET %{http_code} %{size_download}\n"
          pdfinfo p.pdf | grep -E "Pages|Producer" | sed 's/^/I /'
          pdftotext -layout p.pdf t.txt; wc -c t.txt | sed 's/^/I /'
          grep -n -i -m3 -A14 "гласувал\|„за“\|поименно\|Резултат" t.txt | head -60 | sed 's/^/T /'
          grep -n -m4 -B2 -A3 "Р Е Ш Е Н И Е\|РЕШЕНИЕ №\|Решение №" t.txt | head -30 | sed 's/^/R /'
