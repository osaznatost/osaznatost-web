name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://register.ksb.bg/ https://www.ksb.bg/ https://ksb.bg/bg/registar https://www.mrrb.bg/bg/koncesii/ https://nkr.government.bg/ https://registry.government.bg/ https://www.eppo.europa.eu/en/media/news ; do echo "== $u"; curl -sL -A "$UA" -m 30 -o p.html -w "%{http_code} %{url_effective} %{size_download}\n" "$u" || true; grep -o '<title>[^<]*' p.html | head -1; done
