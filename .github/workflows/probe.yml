name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" -X POST -H "X-Requested-With: XMLHttpRequest" --data "FromDate=01.01.1990&ToDate=28.11.2026&ConcessionTypeId=940f9874-743b-45a6-86f4-9453a2a90598" https://nkr.government.bg/Concessions/Search > r.html; wc -c r.html
          python3 -c "
          import re; s=open('r.html').read(); print(s[:5000]); print('ROWS',s.count('<tr'))
          print(set(re.findall(r'href=\"(/[A-Za-z]+/[A-Za-z]+)',s)))"
