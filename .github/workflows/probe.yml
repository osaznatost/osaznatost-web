name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -sL -A "osaznatost-bot/1.0" "https://www.harmanli.bg/uploads/posts/resheniya-ot-10-do-36-ot-29112023-g.pdf" -o a.pdf; ls -la a.pdf; file a.pdf; pdfinfo a.pdf | head -5; echo "CHARS $(pdftotext -layout a.pdf - | wc -c)"; pdftotext -layout a.pdf - | head -60 | sed 's/^/T /'
