name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://nkr.government.bg/Concessions > c.html; wc -c c.html
          grep -o "url[ :]*['\"][^'\"]*['\"]\|transport[^}]*\|/Concessions/[A-Za-z_]*" c.html | sort -u | head -30
          grep -o '<script src="[^"]*Controllers[^"]*"' c.html
          for s in $(grep -o 'src="/Scripts/Controllers/[^"]*"' c.html | cut -d'"' -f2); do echo "--- $s"; curl -sL -A "$UA" "https://nkr.government.bg$s" | grep -o "url[ :]*['\"][^'\"]*['\"]\|/[A-Z][A-Za-z]*/[A-Z][A-Za-z]*" | sort -u | head -20; done
