name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 -H 'Accept: application/json' https://portal.registryagency.bg/CR/api/Deeds/106590683 -o d.json; wc -c d.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('d.json'))
          print('TOP', list(d.keys()))
          for s in d.get('sections',[]):
            print('SEC', {k:v for k,v in s.items() if k!='subDeeds'})
            for sd in s.get('subDeeds',[]):
              print(' SUB', {k:v for k,v in sd.items() if k!='groups'})
              for g in sd.get('groups',[]):
                for fl in g.get('fields',[]):
                  print('  F', fl.get('nameCode'), {k:(str(v)[:80]) for k,v in fl.items() if k not in ('htmlData',)}, re.sub('<[^>]+>',' ',fl.get('htmlData',''))[:160])
          PY
          for u in "Deeds/106590683?loadFieldsFromAllLegalForms=true" "Deeds/106590683/history" "Deeds/106590683?isHistory=true" "Deeds/Search?name=%D0%9C%D0%98%D0%A0%D0%9E%D0%A1%D0%9B%D0%90%D0%92" "Search/SearchPersons?name=x"; do echo "## $u $(curl -s -m 30 -o /dev/null -w '%{http_code} %{size_download}' -H 'Accept: application/json' "https://portal.registryagency.bg/CR/api/$u")"; done
