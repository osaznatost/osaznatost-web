name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils antiword >/dev/null 2>&1
      - run: node probe/grepvotes.mjs https://vidinobs.com/storage/protocols/mqlXxnnE0z6lvFNTzozBOR6LmXe96SzJbChZUHiL.doc https://yambol.bg/uploads/A5DACBF0E27762DE131BF59E112E2FFA https://os-nessebar.eu/resheniya/resheniya-ot-protokol-3612092023-g
