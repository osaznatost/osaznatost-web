name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/look.py "https://www.dobrich.bg/bg/resheniya-mandat-2023-2027-g" "https://www.gabrovo.bg/bg/page/274" "https://obs.kazanlak.bg/" "https://www.dimitrovgrad.bg/bg/obshtinski-savet" "https://www.petrich.bg/bg/obshinski-svet/zasedaniya/" "https://www.sevlievo.bg/bg/resheniya-na-obshtinski-savet-sevlievo" "https://www.nova-zagora.bg/bg/zasedania-i-reshenia" "https://www.kameno.bg/bg/page/482" "https://www.svishtov.bg/obshtinski" 2>&1 | cut -c1-600
          for S in https://sandanski.bg https://panagyurishte.bg https://www.razgrad.bg https://www.asenovgrad.bg https://www.troyan.bg https://www.pomorie.bg https://www.velingrad.bg https://www.chervenbryag.bg https://www.harmanli.bg https://www.svilengrad.bg; do
            echo "## WP $S"; curl -s -m 30 -A "osaznatost-bot/1.0" "$S/wp-json/wp/v2/categories?per_page=100" | python3 -c "import json,sys
          try: [print('  C',c['id'],c['name'],c['count']) for c in json.load(sys.stdin) if c['count']>5]
          except Exception as e: print('  no wp')" | head -25
          done
