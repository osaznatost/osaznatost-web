name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/all.py "https://www.balchik.bg/bg/mandat-2023-2027|(?i)\.pdf|\.doc|reshen|page|202[3-6]" "https://www.popovo.bg/bg/obs-menu/reshenia-obs-new/reshenia-obs-2023-2027-/2754-reshenia-obs-2026.html|(?i)files\.popovo|\.pdf" 2>&1 | head -40
          curl -s "https://sandanski.bg/wp-json/wp/v2/categories?per_page=100&search=%D0%BF%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB" | python3 -c "import json,sys;[print('  C',c['id'],c['name'],c['count']) for c in json.load(sys.stdin)]"
          curl -s "https://sandanski.bg/wp-json/wp/v2/posts?per_page=2&categories=$(curl -s 'https://sandanski.bg/wp-json/wp/v2/categories?per_page=100&search=%D0%BF%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB' | python3 -c 'import json,sys;print(max(json.load(sys.stdin),key=lambda c:c["count"])["id"])')" | python3 -c "
          import json,sys
          for p in json.load(sys.stdin): print('  P',p['date'],p['title']['rendered'][:100],p['content']['rendered'][:600])"
