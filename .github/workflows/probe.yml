name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -m 60 -H "Origin: https://www.parliament.bg" -H "Referer: https://www.parliament.bg/bg/bills" -H "Accept: application/json" "https://www.parliament.bg/api/v1/bill/167645" > b.json
          node -e 'const b=require("./b.json");console.log("## ",JSON.stringify({f:b.file_list,s:b.static_file,r:b.static_file_rtf}))'
          for u in "https://www.parliament.bg/bills/52/52-602-01-71.rtf" "https://www.parliament.bg/bills/52/866057" "https://www.parliament.bg/pub/bills/52/52-602-01-71.rtf"; do curl -s -m 60 -o x -w "## %{http_code} %{content_type} %{size_download} $u\n" "$u"; head -c 80 x | tr -d '\n'; echo; done
