name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 60 -A "$UA" -o h.html -w "## home %{http_code}\n" https://www.bulnao.government.bg/bg/
          grep -o 'href="[^"]*"' h.html | sort -u | grep -iv "static\|\.css\|\.js" | head -120 | sed 's/^/## /'
