name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://www.balchik.bg/bg/posts/index/42 "https://www.balchik.bg/bg/posts/index/42?page=2"; do echo "## $u"; curl -sL -A "$UA" "$u" | grep -oE 'href="[^"]+"[^>]*>[^<]{0,90}' | grep -iE 'reshen|resheniya|page|mandat' | sort -u | head -25; done
