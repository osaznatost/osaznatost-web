name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 42 37; do
          echo "######## $id"
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/obs/obsview/id/$id -o p.html
          python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<a [^>]*href="([^"]*(?:data/|youtube|youtu)[^"]*)"[^>]*>(.*?)</a>',s,re.S):
              print(m.group(1),'|',html.unescape(re.sub(r'<[^>]+>|\s+',' ',m.group(2))).strip()[:120])
          i=s.find('Дневен ред'); print(html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s[i:i+3000])))[:1500])
          PY
          done
