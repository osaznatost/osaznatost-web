name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in /r-6-1.html /cat-92.html; do
            curl -sL -A "$UA" -m 60 "https://obs.kazanlak.bg$u" -o p.html -w "GET %{http_code} %{size_download} $u\n"
            grep -oE '<a [^>]*href="[^"]+"[^>]*>[^<]{0,90}' p.html | sed 's/<a [^>]*href="\([^"]*\)"[^>]*>/\1 | /' | grep -vE '^(#|javascript)|\.(css|js|png|jpg)' | awk 'NR>25' | head -45 | sed 's/^/L /'
          done
