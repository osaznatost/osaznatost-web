name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for h in karnobat.bg parvomay.bg septemvri.org septemvri.bg gotsedelchev.bg goce-delchev.bg razlog.bg provadia.bg kozloduy.bg pavlikeni.bg sozopol.bg elinpelin.bg aytos.bg byala-slatina.bg teteven.bg radnevo.bg obs.kostinbrod.bg; do
            echo "## $h $(curl -sL -m 25 -o p.html -w '%{http_code} %{url_effective}' -A "$UA" https://$h/)"
            grep -oiE 'href="[^"]+"[^>]*>[^<]{0,60}' p.html | grep -iE 'реш|resh|обс|obs|съвет|savet|council|протокол|protokol' | sort -u | head -8
          done
