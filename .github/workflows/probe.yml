name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          U: ${{ secrets.SUPABASE_URL }}
          K: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          for t in proc_contracts proc_annexes proc_buyers proc_import_state; do
            n=$(curl -sS -I "$U/rest/v1/$t?select=*&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Prefer: count=exact" | grep -i content-range | sed 's/.*\///')
            s=$(curl -sS "$U/rest/v1/$t?select=*&limit=2000&offset=50000" -H "apikey: $K" -H "Authorization: Bearer $K" | wc -c)
            echo "$t rows=$n sample2000_bytes=$s"
          done
          # опит за размера на базата (ако има такава функция)
          curl -sS -X POST "$U/rest/v1/rpc/db_size" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{}' | head -c 300; echo
