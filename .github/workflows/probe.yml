name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (osaznatost.bg)"
          echo "##### ruse category"
          curl -sSL -m 40 -A "$A" "https://obs.ruse-bg.eu/category/%d1%80%d0%b5%d1%88%d0%b5%d0%bd%d0%b8%d1%8f/" -o r.html -w "%{http_code} %{size_download}\n"
          grep -oE 'href="https://obs.ruse-bg.eu/[^"]*"' r.html | sort -u | grep -v -E "wp-|category|feed|tag/" | head -25
          P=$(grep -oE 'href="https://obs.ruse-bg.eu/[^"]*"' r.html | grep -iE "%d1%80%d0%b5%d1%88|resh" | grep -v category | head -1 | cut -d'"' -f2)
          echo "POST $P"; curl -sSL -m 40 -A "$A" "$P" -o rp.html; python3 - <<'P'
          import re,html
          s=open("rp.html",encoding="utf-8",errors="replace").read()
          print(re.findall(r'href="([^"]+\.(?:pdf|docx?))"',s)[:15])
          t=re.sub(r"<script.*?</script>|<style.*?</style>","",s,flags=re.S); t=html.unescape(re.sub(r"<[^>]+>","\n",t)); t=re.sub(r"\n\s*\n+","\n",t)
          i=t.find("РЕШЕНИЕ"); print(t[max(0,i-500):i+2500] if i>=0 else t[:2500])
          P
          echo "##### stara zagora"
          curl -sSL -m 40 -A "$A" "https://www.starazagora.bg/bg/arhiv-resheniya" -o sz.html -w "%{http_code} %{size_download}\n"; grep -oE 'href="[^"]*"' sz.html | grep -iE "resh|pdf|doc|protok|uploads" | sort -u | head -30
          echo "##### varna arhiv"
          curl -sSL -m 40 -A "$A" "https://varnacouncil.bg/arhiv/" -o va.html -w "%{http_code} %{size_download}\n"; grep -oE 'href="[^"]*"' va.html | grep -iE "resh|pdf|doc|protok|uploads|sesi" | sort -u | head -30
          curl -sSL -m 40 -A "$A" "https://varnacouncil.bg/" -o v0.html; grep -oE 'href="https://varnacouncil.bg/[^"]*"' v0.html | sort -u | head -60
