name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > x.py <<'X'
          import re,urllib.request,html
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          g=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=40).read().decode("utf-8","ignore")
          h=g("https://www.samokov.bg/bg/web/council/sessions-2023-2027")
          pg=[html.unescape(a) for a in re.findall(r'href="([^"]*INSTANCE_ihev[^"]*)"',h)]
          print("PAG",pg[:2])
          w=[html.unescape(a) for a in re.findall(r'href="(https://www\.samokov\.bg/web/council/w/[^"]+)"',h)]
          print("W",len(w),w[0])
          s=g(w[0])
          for a,t in re.findall(r'<a\s[^>]*?href="([^"]+)"[^>]*>([\s\S]{0,200}?)</a>',s):
            if re.search(r'documents|\.pdf|\.doc',a,re.I): print("  F",a[:200],"|",re.sub(r'<[^>]+>|\s+',' ',t)[:80])
          i=s.find("РЕШЕНИЕ"); print("TXT",i,re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s[i:i+600])))
          X
          python3 x.py
