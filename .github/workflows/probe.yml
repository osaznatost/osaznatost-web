name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: { PW: "${{ secrets.SITE_PASSWORD }}" }
        run: |
          C="osz_auth=$(printf %s "$PW" | sha256sum | cut -d' ' -f1)"
          B=https://osaznatost.pavlin140.workers.dev
          curl -s -H "Cookie: $C" "$B/porachki/firma/130206808" | sed 's/<[^>]*>/ /g' | grep -o "Сигнали за риск[^·]\{0,400\}\|Петър Димитров Павлов[^.]\{0,80\}\|Свързана с длъжностни лица[^.]\{0,200\}" | head -5
          echo ---; curl -s -H "Cookie: $C" "$B/api/firm-signals?eik=130206808,131090107" ; echo
