name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p /tmp/r && cd /tmp/r && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/probe/render.mjs /tmp/r/ && node render.mjs "https://bansko.bg/administratsiya/obsthinski-savet/protokoli-i-resheniya/" "https://www.velingrad.bg" "https://www.troyan.bg" "https://panagyurishte.bg/obsthinski-savet/" "https://www.chervenbryag.bg" "https://www.rakovski.bg" "https://www.pomorie.bg" "https://sandanski.bg/%d0%be%d0%b1%d1%89%d0%b8%d0%bd%d1%81%d0%ba%d0%b8-%d1%81%d1%8a%d0%b2%d0%b5%d1%82/" "https://www.popovo.bg/bg/obs-menu/reshenia-obs-new/reshenia-obs-2023-2027-/2754-reshenia-obs-2026.html" "https://www.balchik.bg/bg/posts/index/42"
