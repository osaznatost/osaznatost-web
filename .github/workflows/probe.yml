name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 240 "https://portal.registryagency.bg/CR/dist/Reports.d57d44dfc439ebdaec0e.js" -o r.js
          m=$(curl -s -m 60 "https://portal.registryagency.bg/CR/Reports/ActiveConditionTabResult?uic=106590683" | grep -oE '/CR/dist/main[^"]+'); curl -s -m 120 "https://portal.registryagency.bg$m" -o main.js
          grep -oE '.{0,160}SubjectInFields.{0,60}' r.js | head -3
          grep -oE '.{0,120}(baseUrl|apiUrl|serviceUrl|"Deeds"|Deeds/").{0,120}' r.js main.js | head -20
          B=https://portal.registryagency.bg/CR/api
          G=$(python3 -c "import urllib.parse;print(urllib.parse.quote('ИВАН АЛЕКСАНДРОВ ГАВАЛЮГОВ'))")
          echo "## search $(curl -s -m 200 -H 'Accept: application/json' -o s.json -w '%{http_code} %{size_download} %{time_total}' "$B/Deeds/SubjectInFields?name=$G&searchInHistory=true&type=1")"; head -c 3000 s.json; echo
