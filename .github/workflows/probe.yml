name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -m 40 -A "$UA" https://silistra.egov.bg/ ; echo
          curl -sL -m 40 -A "$UA" "https://silistra.egov.bg/wps/portal/municipality-silistra/" | head -c 600; echo
          for u in https://plovdivcouncil.bg/ https://www.plovdiv-os.bg/ https://os.plovdiv.bg/ https://www.os-plovdiv.bg/ https://obshtinskisavet.plovdiv.bg/; do curl -sL -m 30 -A "$UA" -o p.html -w "## $u %{http_code} %{url_effective} %{size_download}\n" "$u"; done
