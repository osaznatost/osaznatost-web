name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" -m 60 -c c.txt "https://seu.dfz.bg/seu/f?p=727:8110:::NO:::" -o p.html -w "GET %{http_code} %{size_download}\n"
          grep -c "One moment\|captcha" p.html | sed 's/^/CH /'
          grep -oE '<label[^>]*>[^<]{2,40}</label>' p.html | head -20 | sed 's/^/LB /'
          grep -oE 'id="P8110_[A-Z_0-9]+"' p.html | sort -u | head -30 | sed 's/^/ID /'
