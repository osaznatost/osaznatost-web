name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          node probe/render.mjs "https://sozopol.obs-savet.eu/obs/%D0%9F%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB%D0%B8%20%D1%81%20%D1%80%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%BD%D0%B0%20%D0%9E%D0%B1%D0%A1" "https://sozopol.obs-savet.eu/blog/protokol-3404112026-g"
          curl -s -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" https://sozopol.obs-savet.eu/blog/protokol-3404112026-g | grep -oE '(https?:)?[^" ]+\.(pdf|docx?)' | sort -u | head
