name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
      - run: |
          curl -sL -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" https://obs.ruse-bg.eu/wp-content/uploads/2026/11/1114.pdf -o f.pdf; pdftotext -layout f.pdf - | sed 's/^/T| /' | head -80
