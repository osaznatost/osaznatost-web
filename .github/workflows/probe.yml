name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 60 https://ted.europa.eu/en/notice/56-2020/xml -o n.xml -w "%{http_code} %{content_type}\n"
          python3 - <<'PY'
          import re
          s=open('n.xml',encoding='utf-8',errors='ignore').read()
          print(len(s))
          i=s.find('<CONTRACTING_BODY'); print(s[i:i+900])
          i=s.find('<OBJECT_CONTRACT'); print(s[i:i+700])
          i=s.find('<PROCEDURE'); print(s[i:i+400])
          i=s.find('<AWARD_CONTRACT'); print(s[i:i+2200])
          PY
