name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://sozopol.obs-savet.eu/; do rm -f p.html; echo "## $u $(curl -sL -m 30 -o p.html -w '%{http_code}' -A "$UA" "$u")"; grep -oiE 'href="[^"]+"[^>]*>[^<]{0,80}' p.html | sort -u | head -40; grep -oiE '[a-z0-9-]+\.obs-savet\.eu' p.html | sort -u; done
