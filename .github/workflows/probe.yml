name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://www.adfi.minfin.bg/bg | python3 -c "
          import sys,re,html
          for h,t in re.findall(r'<a[^>]+href=\"([^\"]+)\"[^>]*>(.*?)</a>',sys.stdin.read(),re.S):
            t=re.sub(r'\s+',' ',html.unescape(re.sub('<[^>]+>','',t))).strip()
            if re.search('инспекц|Доклад|Информация',t): print(h,t)"
