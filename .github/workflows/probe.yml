name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > x.py <<'X'
          import re,sys,urllib.request,html
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          def g(u):
            try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=40).read().decode("utf-8","ignore")
            except Exception as e: return "ERR "+str(e)
          for u in sys.argv[1:]:
            h=g(u); print("##",u,len(h))
            seen=set()
            for a,t in re.findall(r'<a\s[^>]*?href="([^"]+)"[^>]*>([\s\S]{0,200}?)</a>',h):
              t=re.sub(r'<[^>]+>|\s+',' ',t).strip(); a=html.unescape(a)
              if a in seen: continue
              if re.search(r'глас|vot|протокол|protokol|поименн|stenogr|стеногр|\.pdf|\.xls',a+" "+t,re.I): seen.add(a); print("  L",a[:160],"|",t[:70])
          X
          python3 x.py https://varnacouncil.bg/ https://www.burgascouncil.org/ https://www.burgascouncil.org/reshenia 2>&1 | head -120
