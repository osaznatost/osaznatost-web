name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 https://portal.registryagency.bg/CR/ -o i.html; grep -oE 'src="[^"]+\.js"' i.html | head
          for s in $(grep -oE 'src="[^"]+\.js"' i.html | sed 's/src="//;s/"//'); do
            u=$s; case $u in http*) ;; /*) u="https://portal.registryagency.bg$u";; *) u="https://portal.registryagency.bg/CR/$u";; esac
            curl -s -m 60 "$u" >> all.js
          done
          wc -c all.js
          grep -oE '"[^"]{0,60}(api/|Deeds|History|history|Persons|Search)[^"]{0,80}"' all.js | sort -u | head -120
