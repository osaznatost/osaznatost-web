name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://www.adfi.minfin.bg/bg/34 > 34.html
          python3 -c "
          import re,html
          s=open('34.html').read(); i=s.find('информацията се актуализира'); b=s[i:]
          print(b[:6000])
          print('TR',b.count('<tr'),'TABLES',b.count('<table'))
          k=b.find('Ботевград'); print('BOT',k); print(b[max(0,k-1500):k+800] if k>0 else '')"
