name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -A "$UA" https://www.burgascouncil.org/node/3663 > n.html
          grep -oE 'href="[^"]+\.(pdf|docx?)"' n.html | head
          u=$(grep -oE 'href="[^"]*protokol[^"]*\.pdf"' n.html | head -1 | sed 's/href="//; s/"$//'); case "$u" in http*) ;; *) u="https://www.burgascouncil.org$u";; esac; echo "## $u"
          curl -s -A "$UA" "$u" -o p.pdf; pdftotext -layout p.pdf p.txt; wc -c p.txt
          python3 -c "
          import re;t=open('p.txt').read()
          for m in list(re.finditer(r'(?i)(гласувал|поименно|„за“|\"за\")',t))[:3]: print('>>>',re.sub(r'[ \t]+',' ',t[max(0,m.start()-700):m.start()+900]))
          "
