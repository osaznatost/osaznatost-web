name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Страници на живо
        env:
          PW: ${{ secrets.SITE_PASSWORD }}
        run: |
          H=$(printf '%s' "$PW" | sha256sum | cut -d' ' -f1)
          B=https://osaznatost.pavlin140.workers.dev
          for p in / /vlast /vlast/obshtinski-savet /mesta /mesta/sfo /mesta/sfo/sfo07 /mesta/bgs/bgs04 /lica/ivan-aleksandrov-gavalyugov-537220 /porachki; do
            s=$(date +%s.%N); code=$(curl -s -m 60 -o p.html -w '%{http_code}' -H "Cookie: osz_auth=$H" "$B$p"); e=$(date +%s.%N)
            echo "PAGE $p $code $(wc -c < p.html) $(python3 -c "print(round($e-$s,1))")s err=$(grep -c 'Страницата не се зареди\|Application error\|Проверката не успя' p.html) risk=$(grep -o 'Сигнали за риск[^<]\{0,60\}' p.html | head -1)"
          done
