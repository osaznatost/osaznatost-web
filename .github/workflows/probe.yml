name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 240 "https://portal.registryagency.bg/CR/dist/Reports.d57d44dfc439ebdaec0e.js" -o r.js; wc -c r.js
          grep -oE '.{0,70}api/[A-Za-z/{}$.+"`?=&]{0,100}' r.js | sort -u | head -150
          echo ===; grep -oE '.{0,100}[Hh]istor.{0,100}' r.js | sort -u | head -40
          echo ===; grep -oE '.{0,100}(Person|person)[A-Za-z]*Search.{0,100}' r.js | sort -u | head -20
