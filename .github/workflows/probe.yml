name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://botevgrad.bg/obsavet/ https://botevgrad.bg/obsavet https://botevgrad.bg/ ; do
            echo "=== $u"; curl -sSL -A "Mozilla/5.0" -m 30 "$u" -o p.html -w "%{http_code} %{url_effective}\n"; grep -oE 'href="[^"]*"' p.html | sort -u | grep -iE 'obsav|savet|resh|protok|zased' | head -60
          done
