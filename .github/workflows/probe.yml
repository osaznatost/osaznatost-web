name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (osaznatost.bg)"
          for u in https://www.plovdiv.bg/item/obshtinski-savet/ https://www.plovdiv.bg/obshtinski-savet/ https://obs.plovdiv.bg/ https://www.plovdiv.bg/category/obshtinski-savet/resheniya/ https://www.varna.bg/bg/obs https://www.varna.bg/bg/129 https://varna.bg/bg/1222 https://www.varnacouncil.bg/ https://obs.varna.bg/ https://www.ruse-bg.eu/bg/pages/159/index.html https://obs.ruse-bg.eu/ https://www.starazagora.bg/bg/obshtinski-savet https://obs.starazagora.bg/ https://www.pleven.bg/bg/obshtinski-savet https://obs.pleven.bg/; do
            code=$(curl -sSL -m 40 -A "$A" -o p.html -w "%{http_code} %{url_effective}" "$u" || echo fail)
            echo "== $u -> $code $(wc -c <p.html 2>/dev/null)"
            grep -oiE 'href="[^"]*(reshen|решен|protokol|протокол|obs|council)[^"]*"' p.html 2>/dev/null | sort -u | head -15
            sleep 2
          done
