name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 https://app.eop.bg/today/598364 -o i.html
          for js in $(grep -oE 'src="[^"]+\.js"' i.html | sed 's/src="//;s/"//'); do curl -sS -m 60 "https://app.eop.bg/$js" -o "b_$(basename $js)"; done
          ls -la b_*
          cat b_*.js | grep -oE '"[^"]{0,40}(api|Api|API)[^"]{0,80}"' | sort -u | head -80
          cat b_*.js | grep -oE '(https?:)?//[a-z0-9.-]+eop\.bg[^"'"'"' ]{0,60}' | sort -u | head -30
          cat b_*.js | grep -oE '"/?(tenders?|public|documents?|procedures?)/[^"]{0,80}"' | sort -u | head -60
