name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q poppler-utils antiword >/dev/null 2>&1
      - name: Казанлък
        env: { ONLY: SZR12, MINUTES: "25" }
        run: |
          node scripts/enrich-council-votes.mjs 2>&1 | tail -40
          node -e 'const d=require("./data/council/SZR12.json").decisions; console.log("RES tally", d.filter(x=>x.tally).length, "named", d.filter(x=>x.votes?.length).length, "of", d.length); const x=d.find(x=>x.number=="964"||x.number==964); console.log("RES 964", JSON.stringify(x?.tally), x?.votes?.length, JSON.stringify(x?.votes?.slice(0,3)))'
