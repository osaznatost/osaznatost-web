name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in 2026-11-12; do
            curl -sS -m 30 "https://storage.eop.bg/open-data-$d?list-type=2" | python3 -c "
          import sys,re,urllib.parse
          s=sys.stdin.read(); print(s[:300])
          for k in re.findall(r'<Key>(.*?)</Key>',s): print(k)"
          done
          echo "##### botevgrad buyer profile"
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/ -o h.html; grep -oE 'href="[^"]*(profil|kupuvach|pazar|poruch)[^"]*"' h.html | sort -u | head
