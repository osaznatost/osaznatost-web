name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          m=$(curl -s -m 60 "https://portal.registryagency.bg/CR/Reports/ActiveConditionTabResult?uic=106590683" | grep -oE '/CR/dist/main[^"]+')
          curl -s -m 180 "https://portal.registryagency.bg$m" -o all.js; wc -c all.js
          for c in $(grep -oE '/CR/dist/[0-9a-z.]+\.js' all.js | sort -u | head -40); do curl -s -m 120 "https://portal.registryagency.bg$c" >> all.js; done
          wc -c all.js
          grep -oE '.{0,60}api/[A-Za-z/{}$.+"`]{0,90}' all.js | sort -u | head -200
