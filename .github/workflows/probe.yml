name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 40 -A "$UA" -D h.txt "https://www.plovdiv.bg/obs/wp-json/wp/v2/categories?per_page=100" -o c.json; grep -i "x-wp-total" h.txt
          python3 -c "import json;[print('  C',c['id'],c['name'],c['count'],c['parent']) for c in json.load(open('c.json'))]"
          ID=$(python3 -c "import json;print([c['id'] for c in json.load(open('c.json')) if c['name']=='Решения'][0])")
          curl -s -m 60 -A "$UA" -D h2.txt "https://www.plovdiv.bg/obs/wp-json/wp/v2/posts?categories=$ID&per_page=3&orderby=date&order=desc" -o p.json; grep -i "x-wp-total" h2.txt
          python3 - <<'PY'
          import json,re,html
          for p in json.load(open('p.json')):
            print('  P',p['id'],p['date'],html.unescape(p['title']['rendered'])[:200],p['link'][:120])
            c=html.unescape(re.sub(r'<[^>]+>',' ',p['content']['rendered']))
            print('    ',re.sub(r'\s+',' ',c)[:1800])
            print('    links',re.findall(r'href="([^"]+)"',p['content']['rendered'])[:5])
          PY
