name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://silistra.egov.bg/ https://www.plovdiv.bg/ https://obs.plovdiv.bg/ https://www.smolyan.bg/ https://targovishte.bg/ https://www.targovishte.bg/ https://silistra.egov.bg/wps/portal/municipality-silistra/administration/council; do
            curl -sL -m 40 -A "$UA" -o p.html -w "## $u %{http_code} %{url_effective} %{size_download}\n" "$u"
            grep -oiE 'href="[^"]*"' p.html | grep -iE 'reshen|savet|suvet|council|obs|resolution|решени|съвет' | sort -u | head -12
          done
