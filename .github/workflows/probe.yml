name: Проба
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Сбор
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: RISK_ONLY=1 node scripts/build-place-suppliers.mjs && ls data/proc/place-risk | wc -l && ls -la data/proc/place-risk/PDV22.json
      - name: Запис
        run: |
          git config user.name "osaznatost-bot"; git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/proc/place-risk && git commit -qm "Рискове по общини (първо пълнене)" && for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase -q origin main; done
