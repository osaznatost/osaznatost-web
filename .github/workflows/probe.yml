name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://botevgrad.bg/obs/reshenie/resheniya-na-obs-ot-2026g-3311 https://botevgrad.bg/obs/obsavet https://botevgrad.bg/obs/view/dneven-red-arhiv-20; do
          echo "######## $u"
          curl -sSL -A "Mozilla/5.0" -m 30 "$u" -o p.html
          python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          i=s.rfind('class="current"'); s=s[i:]
          j=s.find('footer'); s=s[:j] if j>0 else s
          s=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
          s=re.sub(r'<a [^>]*href="([^"]+)"[^>]*>',r' [\1] ',s)
          s=re.sub(r'<br\s*/?>|</(p|div|li|tr|h\d)>','\n',s)
          s=html.unescape(re.sub(r'<[^>]+>','',s))
          s=re.sub(r'[ \t]+',' ',s); s=re.sub(r'\n\s*\n+','\n',s)
          print(s[:5000])
          PY
          done
