name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -m 120 -o b.rtf "https://www.parliament.bg/bills/52/52-602-01-71.rtf"; ls -la b.rtf
          node -e 'import("./scripts/lib/rtf.mjs").then(m=>{const t=m.rtfToText(require("fs").readFileSync("b.rtf","latin1"));console.log("## LEN",t.length);for(const l of t.slice(0,9000).split("\n"))console.log("## "+l)})'
