name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          PW: ${{ secrets.SITE_PASSWORD }}
        run: |
          H=$(printf '%s' "$PW" | sha256sum | cut -d' ' -f1)
          B=https://osaznatost.pavlin140.workers.dev
          for p in /lica/ivan-aleksandrov-gavalyugov-537220 /lica/tihomir-sbkov-naidenov-e0d219 /porachki/firma/131090107 /porachki/firma/115004094; do
            curl -s -m 60 -o p.html -H "Cookie: osz_auth=$H" "$B$p"
            echo "PG $p box=$(grep -c 'Сигнали за риск · ' p.html) red=$(grep -o 'border-l-4 pl-3 border-red' p.html | wc -l) or=$(grep -o 'border-l-4 pl-3 border-\[#e08a2e\]' p.html | wc -l)"
            python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8').read()
          i=s.find('Сигнали за риск · ')
          if i>0:
            t=re.sub(r'<[^>]+>','',s[i:i+5000]); t=html.unescape(t)
            print('TX', re.sub(r'\s+',' ',t)[:700])
          PY
          done
