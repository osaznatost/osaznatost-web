name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/all.py "https://www.nova-zagora.bg/bg/node/2677|(?i)\.pdf|\.doc|files|реш" 
          for u in https://www.asenovgrad.bg/bg/resheniya/mandat-2023-g-2027-g https://www.nova-zagora.bg/bg/node/2677; do echo "## $u"; curl -sL -m 30 -A "osaznatost-bot/1.0" "$u" | grep -oE '<(main|article)[^>]{0,80}' | head -3; done
