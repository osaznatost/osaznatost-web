name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/look.py "https://obs.kazanlak.bg/r-6-1.html" "https://www.karlovo.bg/section-97-content.html" "https://www.lom.bg/section-254-content.html" "https://www.nova-zagora.bg/bg/zasedania-i-reshenia" "https://www.dimitrovgrad.bg/bg/aktove-na-obshtinski-savet" "https://www.razgrad.bg/obsinski-s-vet" "https://www.asenovgrad.bg/bg/obshtinski-savet" 2>&1 | grep -vE 'facebook|#main|#aside|#header' | cut -c1-300 | head -230
          curl -sL -m 30 -A "osaznatost-bot/1.0" https://www.gabrovo.bg/bg/page/274 -o g.html; grep -oE '<a[^>]+href="[^"]+"[^>]*>[^<]{0,40}20(2[3-6])[^<]{0,20}' g.html | head
          curl -sL -m 30 -A "osaznatost-bot/1.0" https://www.razgrad.bg -o r.html; grep -oiE '<a[^>]+href="[^"]+"[^>]*>[^<]*(съвет|решени)[^<]*' r.html | head
          curl -sL -m 30 -A "osaznatost-bot/1.0" https://www.asenovgrad.bg -o a.html; grep -oiE '<a[^>]+href="[^"]+"[^>]*>[^<]*(съвет|решени)[^<]*' a.html | head
          curl -sL -m 30 -A "osaznatost-bot/1.0" https://www.dimitrovgrad.bg/bg/obshtinski-savet -o d.html; grep -oiE '<a[^>]+href="[^"]+"[^>]*>[^<]*(акт|решени|2023)[^<]*' d.html | head
