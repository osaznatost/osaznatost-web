name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in $(cat probe/slugs.txt); do c=$(curl -s -m 6 -o /dev/null -w '%{http_code}' https://$s.obs-savet.eu/); [ "$c" = "200" ] && echo "HIT $s"; done; echo done
