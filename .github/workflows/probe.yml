name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y -qq poppler-utils antiword >/dev/null 2>&1
      - run: |
          for c in PER32 SZR22 HKV11 VID16 HKV34; do rm -f data/council/$c.json; ONLY=$c MINUTES=2 node scripts/import-council-sites.mjs; done
      - run: |
          python3 - <<'PY'
          import json,os
          for c in "PER32 SZR22 HKV11 VID16 HKV34".split():
            f=f'data/council/{c}.json'
            if not os.path.exists(f): print("X",c,"нищо"); continue
            d=json.load(open(f))['decisions']
            print("X",c,len(d),"tally",sum(1 for x in d if x['tally']),"rej",sum(1 for x in d if x['result']=='rejected'))
            for x in d[:3]: print("  ",x['number'],x['date'],x['session'],x['tally'],"|",x['title'][:150],"|",x['text'][:120])
          PY
