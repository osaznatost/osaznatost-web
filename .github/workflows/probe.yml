name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 30 -A "$UA" "https://primorsko.bg/wp-json/wp/v2/posts?categories=20&per_page=2" | python3 -c "import json,sys
          for p in json.load(sys.stdin): print('  P',p['date'],p['title']['rendered'][:90],p['content']['rendered'][:700].replace('\n',' '))"
          for u in https://www.isperih.bg/decisions https://www.lukovit.bg/bg/reshenia https://tsarevo.bg/obshtinski-savet/resheniya; do echo "## $u"; curl -sL -m 30 -A "$UA" "$u" > p.html; wc -c < p.html; grep -oiE 'href="[^"]+"[^>]*>[^<]{0,70}' p.html | grep -viE 'facebook|\.css|favicon|#' | grep -iE 'реш|resh|pdf|doc|zased|заседан|page|202[3-6]' | sort -u | head -25; done
