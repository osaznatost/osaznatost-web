name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: ДФЗ
        env: { ONLY: "София (област)", MINUTES: "20" }
        run: |
          node scripts/fetch-dfz.mjs 2025 20000
          node -e 'const d=require("./data/dfz/subsidies-2025.json"); console.log("RES", d.rows.length, JSON.stringify(d.rows.sort((a,b)=>b[6]-a[6]).slice(0,6)))'
