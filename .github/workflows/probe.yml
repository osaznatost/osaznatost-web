name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for D in 2026-11-12 2026-11-10; do DD=$(date -d $D +%d.%m.%Y)
          curl -sS -m 120 -o o$D.json "https://storage.eop.bg/open-data-$D/$(python3 -c "import urllib.parse;print(urllib.parse.quote('Автоматично генерирани данни за обявления, публикувани в ЦАИС ЕОП на $DD г., съгласно стандарт OCDS.json'))")"; done
          python3 - <<'PY'
          import json,glob
          rel=[r for f in glob.glob('o*.json') for r in json.load(open(f))['releases']]
          m=[r for r in rel if 'contract' in r['tag'] and any('ОБЩИНА' in (p.get('name') or '').upper() for p in r['parties'])]
          print(len(m))
          r=m[0]
          print('PARTIES', json.dumps(r['parties'],ensure_ascii=False)[:3000])
          print('BIDS', json.dumps(r.get('bids'),ensure_ascii=False)[:1500])
          print('AWARDS', json.dumps(r.get('awards'),ensure_ascii=False)[:1500])
          print('CONTRACTS', json.dumps(r.get('contracts'),ensure_ascii=False)[:2500])
          print('TENDER keys', list(r['tender'].keys()))
          print('TENDER extra', json.dumps({k:v for k,v in r['tender'].items() if k not in ('description','lots','items','title')},ensure_ascii=False)[:2500])
          a=[r for r in rel if 'contractAmendment' in r['tag']][0]
          print('AMEND', json.dumps(a.get('contracts'),ensure_ascii=False)[:2000])
          PY
