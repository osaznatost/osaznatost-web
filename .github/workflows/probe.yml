name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="osaznatost-bot/1.0"
          curl -sL -A "$UA" "https://www.dobrich.bg/uploads/posts/2026/res-38_27_10_2026.pdf" -o a.pdf; echo "## DOB"; pdftotext -layout a.pdf - | head -70
          curl -sL -A "$UA" "https://www.kameno.bg/userfiles/files/%D0%A0%D0%95%D0%A8%D0%95%D0%9D%D0%98%D0%AF%20%E2%84%9610.pdf" -o b.pdf; echo "## KAM"; pdftotext -layout b.pdf - | head -50; pdffonts b.pdf | head -5
          echo "## SEV"; python3 probe/look.py "https://www.sevlievo.bg/bg/resheniya-na-obshtinski-savet-sevlievo/resheniya-na-obshtinskiya-savet-s-protokol-12-ot-21-oktomvri-2026-g" | grep -E '^   (T|L.*(pdf|doc))' | cut -c1-3000
