name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          J="-b j -c j -sL -A osaznatost-bot/1.0"
          curl $J https://nkr.government.bg/ > h.html
          grep -o ".\{200\}api/public/card.\{100\}" h.html
          grep -o "https\?://[a-z0-9.]*[^\"' ]*api/public[^\"' ]*" h.html | head
          curl $J https://nkr.government.bg/Concessions > c.html; grep -o "/[A-Z][a-zA-Z]*/[A-Z][a-zA-Z]*Details[^\"' ]*\|/[A-Z][a-zA-Z]*/[A-Z][a-zA-Z]*Info[^\"' ]*\|Concessions/[A-Za-z]*" c.html | sort -u
