name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=2026-11-12; DD=12.11.2026
          curl -sS -m 120 -o o.json "https://storage.eop.bg/open-data-$D/$(python3 -c "import urllib.parse;print(urllib.parse.quote('Автоматично генерирани данни за обявления, публикувани в ЦАИС ЕОП на $DD г., съгласно стандарт OCDS.json'))")"
          curl -sS -m 120 -o p.json "https://storage.eop.bg/open-data-$D/$(python3 -c "import urllib.parse;print(urllib.parse.quote('Автоматично генерирани данни за поръчки, публикувани в ЦАИС ЕОП на $DD.json'))")"
          ls -la o.json p.json
          python3 - <<'PY'
          import json,collections
          o=json.load(open('o.json'))
          print(type(o), list(o.keys())[:10] if isinstance(o,dict) else len(o))
          rel=o.get('releases') if isinstance(o,dict) else o
          print('releases',len(rel))
          tags=collections.Counter(t for r in rel for t in r.get('tag',[])); print(tags)
          keys=collections.Counter(k for r in rel for k in r.keys()); print(keys)
          # show one with implementation / contracts
          def show(r,n=3500): print(json.dumps(r,ensure_ascii=False)[:n]); print('-----')
          shown=set()
          for r in rel:
            for t in r.get('tag',[]):
              if t not in shown: shown.add(t); print('TAG',t); show(r,2500)
          p=json.load(open('p.json')); pr=p if isinstance(p,list) else p.get('data',p)
          print('PORACHKI', type(p), len(pr)); print(json.dumps(pr[0] if isinstance(pr,list) else pr,ensure_ascii=False)[:2500])
          PY
