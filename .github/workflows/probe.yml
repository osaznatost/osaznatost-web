name: Проба

on:
  push:
    branches: [main]
    paths: [scripts/probe-parliament.mjs]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-parliament.mjs
      - run: |
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/_probe
          git commit -m "Проба" || exit 0
          git pull --rebase
          git push
