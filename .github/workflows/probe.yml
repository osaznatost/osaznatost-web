name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -A "$UA" "https://varnacouncil.bg/wp-content/uploads/2026/01/Електронно-гласуване-№32-от-29.01.2026-г.-.pdf" -o e.pdf; pdfinfo e.pdf | grep Pages; pdftotext -layout e.pdf e.txt; wc -c e.txt; head -c 3500 e.txt
          echo; echo =====PROT
          curl -s -A "$UA" "https://varnacouncil.bg/wp-content/uploads/2026/01/ПРОТОКОЛ-№32-от-29.01.2026-г..pdf" -o p.pdf; pdftotext -layout p.pdf p.txt; wc -c p.txt
          python3 -c "
          import re;t=open('p.txt').read()
          for m in list(re.finditer(r'(?i)гласувал|РЕШИ',t))[3:5]: print('>>>',re.sub(r'[ \t]+',' ',t[max(0,m.start()-900):m.start()+700]))
          "
