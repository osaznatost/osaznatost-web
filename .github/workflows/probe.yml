name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          U: ${{ secrets.SUPABASE_URL }}
          K: ${{ secrets.SUPABASE_SECRET_KEY }}
          P: ${{ secrets.VOTE_PEPPER }}
        run: |
          for t in cv_codes cv_votes cv_totals cv_sends; do echo "$t: $(curl -s -o /dev/null -w '%{http_code}' "$U/rest/v1/$t?limit=1" -H "apikey: $K" -H "Authorization: Bearer $K")"; done
          echo "rpc: $(curl -s -X POST "$U/rest/v1/rpc/cv_count_send" -H "apikey: $K" -H "Authorization: Bearer $K" -H 'content-type: application/json' -d '{"d":"2026-11-24"}')"
          echo "pepper length: ${#P}"
