name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://www.balchik.bg/bg/mandat-2023-2027 https://www.balchik.bg/bg/zasedaniya-na-obshtinski-savet-balchik-mandat-2023-g-2027-g; do echo "## $u"; curl -sL -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" "$u" | grep -oiE 'href="[^"]+"[^>]*>[^<]{0,80}' | grep -viE 'facebook|twitter|\.css|\.js|#"' | sort -u | head -80; done
