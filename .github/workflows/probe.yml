name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://nkr.government.bg/ > h.html; grep -o 'href="[^"]*"' h.html | sort -u | head -60; grep -io '<script[^>]*src="[^"]*"' h.html | head; grep -o 'api[^"'"'"' ]*' h.html | sort -u | head
          sed 's/<[^>]*>/ /g' h.html | tr -s ' \n' | head -c 1500
