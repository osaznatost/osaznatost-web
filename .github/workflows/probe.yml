name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
      - run: |
          for c in VAR06 SZR31; do
            rm -f data/council/$c.json
            ONLY=$c MINUTES=3 node scripts/import-council-sites.mjs
            node -e 'const d=require("./data/council/'$c'.json");console.log(d.decisions.length);for(const x of d.decisions.slice(0,3))console.log(JSON.stringify(x).slice(0,700))' || true
          done
