name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
      - run: |
          git fetch -q origin main && git checkout -q origin/main -- data/council/SLV20.json
          DEBUG=1 ONLY=SLV20 MINUTES=6 node scripts/enrich-council-votes.mjs
          python3 -c "
          import json;d=json.load(open('data/council/SLV20.json'))
          xs=[x for x in d['decisions'] if x.get('votes')]
          print('VOTES',len(xs))
          for x in xs[:2]: print(x['number'],x['tally'],len(x['votes']),x['votes'][:3])"
