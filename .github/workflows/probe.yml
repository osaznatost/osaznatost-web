name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/obs/reshenie/resheniya-na-obs-ot-2026g-3311 -o r2026.html
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/obs/obsavet -o zased.html
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/obs/view/savetnitsi-4 -o savet.html
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/obs/view/dneven-red-arhiv-20 -o dnevred.html
          curl -sSL -A "Mozilla/5.0" -m 30 https://botevgrad.bg/data/obsavet/files/1781877401.pdf -o sample.pdf
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: out }
