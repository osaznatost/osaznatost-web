name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://www.silistra.bg/ https://silistra.bg/ https://obs.silistra.bg/ https://os.silistra.bg/ https://www.obs-silistra.bg/ https://silistra.bg/obshtinski-savet https://www.silistra.bg/bg/obshtinski-savet; do
            curl -sL -m 30 -A "$UA" -o p.html -w "## $u %{http_code} %{url_effective} %{size_download}\n" "$u"
            grep -oiE 'href="[^"]*(reshen|savet|sachet|council|обс|решени)[^"]*"' p.html | sort -u | head -15
          done
