name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 60 -A "$UA" -o i.html https://portal.registryagency.bg/CR/
          grep -o 'src="[^"]*\.js[^"]*"' i.html | sed 's/^/## JS /'
          for j in $(grep -o 'src="[^"]*\.js[^"]*"' i.html | sed 's/src="//;s/"$//'); do
            case $j in http*) u=$j;; /*) u=https://portal.registryagency.bg$j;; *) u=https://portal.registryagency.bg/CR/$j;; esac
            curl -s -m 60 -A "$UA" "$u" | grep -o '"[^"]*api/[^"]*"' | sort -u | head -80 | sed "s|^|## API |"
          done
