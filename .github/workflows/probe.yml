name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -m 60 https://assets.dm.de/product/2026.1124.1610/product-dm.min.js -o p.js
          grep -oE '.{0,100}(baseUrl|BASE_URL|apiUrl|productApi|PRODUCT_API)[^;]{0,120}' p.js | head -8
          grep -oE 'https://[a-z0-9.-]+(\.com|\.de|\.cloud)[^"`]{0,40}' p.js | sort -u | head -20
          for b in https://products.dm.de https://product.services.dmtech.com https://shopping.services.dmtech.com https://products.services.dmtech.com https://product-api.services.dmtech.com; do echo "## $b $(curl -s -m 20 -A "$UA" -o x -w '%{http_code}' "$b/product/detail/BG/dan/1913393") $(head -c 120 x)"; done
