name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          F='(?i)\.pdf|\.docx?|reshen|решени|protokol|протокол|202[3-6]|posts/view|page='
          python3 probe/all.py "https://www.svilengrad.bg/bg/resheniya-na-obshtinski-savet|$F" "https://os-nessebar.eu/resheniya|." "https://www.popovo.bg/bg/obs-menu/reshenia-obs-new/reshenia-obs-2023-2027-.html|." "https://www.aksakovo.bg/section-4167-content.html|$F" "https://www.balchik.bg/bg/posts/index/42|$F" 2>&1 | cut -c1-200
          for u in https://www.svilengrad.bg/bg/resheniya-na-obshtinski-savet https://os-nessebar.eu/resheniya https://www.popovo.bg/bg/obs-menu/reshenia-obs-new/reshenia-obs-2023-2027-.html https://www.balchik.bg/bg/posts/index/42 https://bansko.bg/administratsiya/obsthinski-savet/protokoli-i-resheniya/; do echo "## RAW $u"; curl -sL -m 30 -A "osaznatost-bot/1.0" "$u" | grep -oiE '(iframe[^>]{0,200}|data-src="[^"]{0,150}|ajax[^"'"'"' ]{0,120}|\.pdf[^"]{0,5})' | sort | uniq -c | sort -rn | head -8; done
