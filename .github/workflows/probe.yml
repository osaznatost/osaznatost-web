name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          A="Mozilla/5.0 (osaznatost.bg)"
          echo "##### varna"
          curl -sSL -m 40 -A "$A" "https://varnacouncil.bg/reshenija-na-obshtinski-savet-varna-mandat-2023-2027/" -o v.html -w "%{http_code} %{size_download}\n"
          grep -oE 'href="[^"]*"' v.html | grep -vE "wp-content/(themes|plugins)|wp-includes|feed|\.css|\.js" | sort -u | grep -iE "pdf|doc|reshen|uploads|zased|protok" | head -40
          F=$(grep -oE 'href="[^"]*\.(pdf|docx?)"' v.html | head -1 | cut -d'"' -f2); echo "FILE $F"
          [ -n "$F" ] && curl -sSL -m 60 -A "$A" "$F" -o f.bin && file f.bin && (pdftotext -layout f.bin - 2>/dev/null | head -80)
          echo "##### stara zagora"
          curl -sSL -m 40 -A "$A" "https://www.starazagora.bg/bg/resheniya-i-protokoli" -o s.html -w "%{http_code} %{size_download}\n"
          grep -oE 'href="[^"]*"' s.html | sort -u | grep -iE "pdf|doc|reshen|uploads|protok" | head -40
