name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          B="https://www.plovdiv.bg/%D0%BE%D0%B1%D1%89%D0%B8%D0%BD%D1%81%D0%BA%D0%B8-%D1%81%D1%8A%D0%B2%D0%B5%D1%82/%D0%BD%D0%BE%D1%80%D0%BC%D0%B0%D1%82%D0%B8%D0%B2%D0%BD%D0%B0-%D0%B1%D0%B0%D0%B7%D0%B0/%D1%80%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F/"
          curl -sL -m 40 -A "$UA" -o l.html "$B"
          grep -oE '<iframe[^>]{0,300}' l.html | head; grep -oE '(admin-ajax[^"]{0,200}|wp-json/[a-z0-9_/-]{3,80})' l.html | sort -u | head -20
          python3 - <<'PY'
          import re,html
          s=html.unescape(open('l.html',errors='ignore').read())
          m=re.search(r'<main.*?</main>',s,re.S) or re.search(r'<article.*?</article>',s,re.S)
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',m.group(0) if m else s,flags=re.S)
          print('  M',re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' | ',t))[:2500])
          PY
          curl -s -m 40 -A "$UA" "https://www.plovdiv.bg/wp-json/wp/v2/pages/2691" | python3 -c "import json,sys,re;d=json.load(sys.stdin);c=d['content']['rendered'];print('  P',len(c),re.sub(r'\s+',' ',c)[:1500])"
