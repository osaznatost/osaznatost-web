name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://www.balchik.bg/bg/mandat-2023-2027 > a.html
          grep -oE 'href="[^"]*(page|\?p=|mandat-2023-2027/[^"]*202[345])[^"]*"' a.html | sort -u | head -20
          curl -sL -A "$UA" "https://www.balchik.bg/bg/mandat-2023-2027?page=2" | grep -oE 'resheniya-ot-zasedanie[^"]+' | sort -u | head -5
          curl -sL -A "$UA" "https://www.balchik.bg/bg/mandat-2023-2027/page/2" | grep -oE 'resheniya-ot-zasedanie[^"]+' | sort -u | head -5
