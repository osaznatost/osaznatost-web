name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://nkr.government.bg/Concessions > c.html
          python3 -c "
          import re; s=open('c.html').read(); i=s.find('<form'); print(s[i:i+6000])
          for m in re.finditer(r'<script>(.*?)</script>',s,re.S):
            if 'Search' in m.group(1) or 'kendo' in m.group(1): print('SCRIPT',m.group(1)[:2500])"
