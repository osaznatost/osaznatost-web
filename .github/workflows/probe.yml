name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://devnya.obs-savet.eu/blog/resheniya-ot-zasedanie-na-ob-s-devnya-ot-30102026-g > a.html
          grep -oE '(uploads|file-download|drive\.google|\.pdf|\.docx?)[^"\\ ]{0,120}' a.html | sort -u | head; python3 -c "import re;t=open('a.html').read();i=t.find('РЕШЕНИЕ');print('>>>',i,re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t[i:i+800])))"
