name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://portal.registryagency.bg/CR/api
          N=$(python3 -c "import urllib.parse;print(urllib.parse.quote('МИРОСЛАВ СИМЕОНОВ ЗАХАРИЕВ'))")
          G=$(python3 -c "import urllib.parse;print(urllib.parse.quote('ИВАН АЛЕКСАНДРОВ ГАВАЛЮГОВ'))")
          for u in "Deeds/106590683/ActiveCondition?includeHistory=true" "Deeds/SubjectInFields?name=$N&searchInHistory=true&type=1" "Deeds/SubjectInFields?uid=&name=$N&searchInHistory=true&type=1&page=1&pageSize=50" "SubjectInFields?name=$N&searchInHistory=true&type=1"; do
            echo "## $u $(curl -s -m 60 -H 'Accept: application/json' -o o.json -w '%{http_code} %{size_download}' "$B/$u")"; head -c 1500 o.json; echo
          done
          echo "## GAV"; curl -s -m 60 -H 'Accept: application/json' "$B/Deeds/SubjectInFields?name=$G&searchInHistory=true&type=1" | head -c 4000; echo
          curl -s -m 60 -H 'Accept: application/json' "$B/Deeds/106590683/ActiveCondition?includeHistory=true" -o h.json
          python3 - <<'PY'
          import json,re
          try: d=json.load(open('h.json'))
          except Exception as e: print('ERR',e); raise SystemExit
          for s in d.get('sections',[]):
            for sd in s.get('subDeeds',[]):
              for g in sd.get('groups',[]):
                for fl in g.get('fields',[]):
                  if fl.get('nameCode') in ('CR_F_7_L','CR_F_19_L','CR_F_23_L'):
                    print(fl.get('nameCode'), fl.get('fieldOperation'), fl.get('fieldEntryDate'), {k:v for k,v in fl.items() if k not in('htmlData',)}.keys(), re.sub('<[^>]+>',' ',fl.get('htmlData',''))[:300])
          PY
