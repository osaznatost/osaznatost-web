name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          J="-b j -c j -sL -A osaznatost-bot/1.0"
          curl $J https://nkr.government.bg/Concessions > c.html
          for s in $(grep -o 'src="/[^"]*"' c.html | cut -d'"' -f2 | grep -v "kendo\|svg"); do curl $J "https://nkr.government.bg$s" >> all.js; done
          cat c.html >> all.js
          grep -o ".\{300\}Clickable.\{500\}" all.js | grep -v "label class" | head -5
          grep -o "url: *['\"][^'\"]*['\"]" all.js | sort -u | head -30
