name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for u in r-266-2025 r-1-2024 r-5-2024 r-900-2024 r-128-2026 r-500-2026 r-700-2026 r-1-2023; do
            code=$(curl -sSL -m 60 -A "Mozilla/5.0 (osaznatost.bg)" -o "$u.pdf" -w "%{http_code} %{content_type} %{size_download}" "https://council.sofia.bg/documents/d/guest/$u" || echo fail)
            echo "== $u $code"
            sleep 2
          done
          pdftotext -layout r-128-2026.pdf - | head -80
          echo ======; pdftotext -layout r-5-2024.pdf - | head -60
          echo ======; pdftotext -layout r-900-2024.pdf - | tail -30
