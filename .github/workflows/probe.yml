name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          echo "## AUCHAN"; curl -s -m 30 -A "$UA" "https://www.auchan.ro/api/catalog_system/pub/products/search?ft=barilla%20spaghetti&_from=0&_to=4" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for p in d[:5]: print(p.get('productName'), '|', p['items'][0].get('ean'), '|', p['items'][0]['sellers'][0]['commertialOffer'].get('Price'), p['items'][0]['sellers'][0]['commertialOffer'].get('ListPrice'))
          except Exception as e: print('ERR',e)"
          echo "## BILLA CZ"; curl -s -m 30 -A "$UA" "https://shop.billa.cz/vyhledavani/barilla%20spaghetti" -o b.html; wc -c b.html; grep -c __NUXT_DATA__ b.html
          echo "## CARREFOUR"; curl -s -m 30 -A "$UA" "https://www.carrefour.ro/catalogsearch/result/?q=barilla+spaghetti" -o c.html; grep -oE 'data-price-amount="[0-9.]+"' c.html | head -3; grep -oE 'class="product-item-link"[^>]*>[^<]{0,80}' c.html | head -3; grep -oE '"gtin13?"\s*:\s*"[0-9]+"' c.html | head -2
          echo "## KONZUM"; curl -s -m 30 -A "$UA" "https://www.konzum.hr/web/search?q=barilla+spaghetti" -o k.html; grep -oE 'data-ga-[a-z]+="[^"]{0,60}"' k.html | head -8; grep -oE 'product-price[^<]{0,80}' k.html | head -3
          echo "## AB"; curl -s -m 30 -A "$UA" "https://www.ab.gr/search?q=barilla" -o a.html; grep -oE '"(name|price|formattedValue|code|ean)":"[^"]{0,60}"' a.html | head -12
