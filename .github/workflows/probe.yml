name: Проба
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_ppp_ind?format=JSON&geo=BG&na_item=PLI_EU27_2020&time=2024" | python3 -c "import json,sys;d=json.load(sys.stdin);c=d['dimension']['ppp_cat']['category'];[print(k,c['label'][k]) for k in c['index']]"
          curl -s "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_ppp_ind?format=JSON&geo=ES&geo=GR&na_item=PLI_EU27_2020&ppp_cat=A01&time=2024" | head -c 600
