name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U="https://suvorovo.obs-savet.eu/obs/%D0%A0%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%BD%D0%B0%20%D0%9E%D0%B1%D1%89%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%20%D1%81%D1%8A%D0%B2%D0%B5%D1%82"
          curl -s "$U" > a.html; grep -oE '[?&]page=[0-9]+|"totalPages":[0-9]+|"total":[0-9]+|/blog/[a-z0-9-]+' a.html | sort | uniq -c | sort -rn | head -20
          curl -s "$U?page=2" | grep -oE '/blog/[a-z0-9-]+' | sort -u | head -5
          curl -s "https://devnya.obs-savet.eu/obs/%D0%A0%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%BD%D0%B0%20%D0%9E%D0%B1%D1%89%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%20%D1%81%D1%8A%D0%B2%D0%B5%D1%82" | grep -oE '/blog/[a-z0-9-]+|/uploads/[^"]+' | sort -u | head
