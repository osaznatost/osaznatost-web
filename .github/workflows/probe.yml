name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          U: ${{ secrets.SUPABASE_URL }}
          K: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          for q in "proc_buyers?select=eik&limit=1" "proc_contracts?select=id&order=contract_date.desc&limit=5" "ingest_state?select=*&limit=3"; do
            echo "## $q $(curl -s -m 60 -o o.json -w '%{http_code} %{time_total}' "$U/rest/v1/$q" -H "apikey: $K" -H "Authorization: Bearer $K") $(head -c 120 o.json)"
          done
