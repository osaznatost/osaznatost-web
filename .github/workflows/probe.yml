name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/look.py "https://www.asenovgrad.bg/bg/resheniya" "https://www.dimitrovgrad.bg/bg/aktove-na-obshtinskiya-savet" "https://www.karlovo.bg/section-493-content.html" "https://www.razgrad.bg/protokoli-i-zapisi-na-zasedania-na-obsinski-s-vet" 2>&1 | grep -vE 'facebook|#main|#aside|#header' | cut -c1-220 | head -160
          for u in https://obs.kazanlak.bg/r-6-1.html https://www.lom.bg/section-254-content.html https://www.gabrovo.bg/bg/page/274; do echo "## F $u"; curl -sL -m 30 -A "osaznatost-bot/1.0" "$u" | grep -oE 'href="[^"]*(202[3-6]|r-6-[0-9]+|page/[0-9]+)[^"]*"[^>]*>[^<]{0,80}' | head -15; done
