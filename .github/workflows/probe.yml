name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          B=https://shopping.services.dmtech.com
          curl -s -m 25 -A "$UA" "$B/product/detail/BG/dan/1913393" -o d.json
          python3 -c "
          import json;d=json.load(open('d.json'));print(list(d.keys()))
          for k in ['gtin','dan','price','title','brand','netQuantityContent','contentUnit','basePrice','metadata','pricing']: print(k, json.dumps(d.get(k),ensure_ascii=False)[:300])"
          for c in DE AT RO HR; do echo "## $c"; curl -s -m 25 -A "$UA" "$B/product/tiles/$c/dans/1913393,1573082,3020074" | head -c 900; echo; done
          echo "## BG tiles"; curl -s -m 25 -A "$UA" "$B/product/tiles/BG/dans/1913393,1573082,3020074" | head -c 1200; echo
