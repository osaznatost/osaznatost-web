name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          m=$(curl -s -m 60 "https://portal.registryagency.bg/CR/Reports/ActiveConditionTabResult?uic=106590683" | grep -oE '/CR/dist/main[^"]+')
          curl -s -m 180 "https://portal.registryagency.bg$m" -o main.js
          grep -oE '"[a-z0-9_-]+":"[0-9a-f]{16,}"' main.js | head -5
          grep -oE '.{0,200}\.js.{0,200}' main.js | head -5
          grep -oE '"[0-9a-z_-]{1,40}"' main.js | head -0
          # chunk names map
          for c in $(grep -oE '[0-9]+:"[0-9a-f]{20}"' main.js | head -60 | sed -E 's/([0-9]+):"([0-9a-f]+)"/\1.\2/'); do curl -s -m 60 "https://portal.registryagency.bg/CR/dist/$c.js" >> all.js; done
          wc -c all.js
          grep -oE '.{0,50}api/[A-Za-z/{}$.+"`]{0,90}' all.js | sort -u | head -200
