name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          J="-b j -c j -sL -A osaznatost-bot/1.0"
          curl $J https://nkr.government.bg/Concessions >/dev/null
          ID=d23eafab-fa35-46cb-a7e4-218a06a8df03
          curl $J "https://nkr.government.bg/ConcessionaireProcedures/ConcessionaireProcedureInfo/$ID" > i.html
          grep -o 'href="[^"]*"\|onclick="[^"]*"\|data-[a-z-]*url="[^"]*"' i.html | grep -v "css\|Content\|^href=\"/\"\|#" | head -20
          U=$(grep -o 'href="[^"]*[Nn]otice[^"]*"\|href="[^"]*Announcement[^"]*"\|href="[^"]*Preview[^"]*"' i.html | head -1 | cut -d'"' -f2); echo U $U
          [ -n "$U" ] && curl $J "https://nkr.government.bg$U" | python3 -c "
          import re,html,sys; s=sys.stdin.read(); s=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
          t=re.sub(r'[ \t]+',' ',html.unescape(re.sub('<[^>]+>','\n',s))); t=re.sub(r'\n\s*\n+','\n',t); print(t[:5000])"
