name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          MINUTES=3 PACE=1500 node scripts/import-concessions.mjs
          node -e 'const j=require("./data/concessions.json");const w=j.items.filter(x=>x.firms.length);console.log(JSON.stringify(w.slice(0,6),null,1));console.log(j.items.filter(x=>x.muni).length)'
