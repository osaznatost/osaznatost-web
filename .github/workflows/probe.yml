name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.gabrovo.bg https://www.gabrovo.bg/bg/page/55 https://obs.kazanlak.bg/page-684.html https://www.kazanlak.bg https://www.karlovo.bg https://www.lom.bg https://www.dupnitsa.bg https://www.samokov.bg https://www.gornaoryahovitsa.bg https://www.goma.bg https://gorna-oryahovitsa.bg; do
            echo "## $u"; curl -sL -m 30 -A "osaznatost-bot/1.0" "$u" | grep -oiE '[a-z0-9._-]+@[a-z0-9.-]+\.(bg|com|eu)' | sort | uniq -c | sort -rn | head -6
          done
