name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -s -A "$UA" -m 60 -X POST https://data.egov.bg/api/searchDataset -H 'Content-Type: application/json' -d '{"criteria":{"keywords":"СЕБРА"},"records_per_page":30}' -o s.json -w "API %{http_code} %{size_download}\n"
          python3 -c "
          import json;d=json.load(open('s.json'))
          print('K', list(d.keys())[:8])
          for x in (d.get('datasets') or d.get('data') or [])[:30]: print('D', x.get('uri'), '|', (x.get('name') or '')[:110] if isinstance(x.get('name'),str) else x.get('name'), '|', x.get('org_id'), x.get('updated_at'))
          " 2>&1 | head -40
          curl -sL -A "$UA" -m 60 "https://data.egov.bg/data/search?q=%D0%A1%D0%95%D0%91%D0%A0%D0%90" -o h.html -w "WEB %{http_code} %{size_download}\n"
          grep -oE 'href="https://data.egov.bg/data/view/[^"]+"[^>]*>[^<]{0,120}' h.html | head -20 | sed 's/^/W /'
