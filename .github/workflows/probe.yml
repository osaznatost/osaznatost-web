name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -qq -y poppler-utils >/dev/null 2>&1
          for U in https://botevgrad.bg/obshtina/poruchka/registar-na-plashtaniya-kam-kontragenti-3 https://botevgrad.bg/obshtina/poruchka/registar-na-osvobodeni-garantsii-po-obshtestveni-porachki-2; do
          echo "##### $U"; curl -sSL -A "Mozilla/5.0" -m 30 "$U" -o p.html
          python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<a [^>]*href="([^"]*data/[^"]+)"[^>]*>(.*?)</a>',s,re.S):
              print(m.group(1),'|',html.unescape(re.sub(r'<[^>]+>|\s+',' ',m.group(2))).strip()[:100])
          PY
          F=$(grep -oE 'https://botevgrad.bg/data/[a-z]+/files/[0-9]+\.(pdf|xlsx?|docx?)' p.html | head -1); echo "FIRST $F"
          curl -sSL -m 60 "$F" -o f.bin; file f.bin; (pdftotext -layout f.bin - 2>/dev/null || true) | sed 's/  */ /g' | grep -v '^\s*$' | head -40
          done
          echo "##### EOP API"
          curl -sS -m 30 -o t.json -w "%{http_code} %{content_type}\n" "https://app.eop.bg/api/public/tenders/598364" ; head -c 500 t.json; echo
          curl -sS -m 30 -o t2.html -w "%{http_code} %{content_type}\n" "https://app.eop.bg/today/598364"; head -c 300 t2.html
