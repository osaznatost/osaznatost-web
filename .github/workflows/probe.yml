name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f data/council/RSE27.json
          ONLY=RSE27 MINUTES=3 node scripts/import-council-sites.mjs
          node -e 'const d=require("./data/council/RSE27.json");console.log(d.decisions.length, d.complete);for(const x of d.decisions.slice(0,4))console.log(JSON.stringify(x).slice(0,900))'
