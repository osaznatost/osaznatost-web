name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/look.py "https://www.dobrich.bg/bg/resheniya-mandat-2023-2027-g/resheniya-ot-zasedaniya-na-obshtinski-savet-prez-2026-g" "https://www.sevlievo.bg/bg/resheniya-na-obshtinski-savet-sevlievo/resheniya-na-obshtinskiya-savet-s-protokol-12-ot-21-oktomvri-2026-g" "https://obs.kazanlak.bg/r-6-1.html" "https://www.svishtov.bg/reshenia" "https://kameno.bg/bg/page/resheniya-2024-godina-514" "https://www.dimitrovgrad.bg/bg/mandati" 2>&1 | cut -c1-700
          curl -sL -m 30 -A "osaznatost-bot/1.0" https://www.gabrovo.bg/bg/page/274 | grep -oE 'href="[^"]*"[^>]*>\s*202[3-6] г' | head
