name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in "https://www.spar.at/produktwelt/suche?q=barilla" "https://shop.rewe.de/productList?search=barilla" "https://www.rewe.de/shop/suche/?search=barilla" "https://www.carrefour.ro/catalogsearch/result/?q=barilla" "https://www.mega-image.ro/search?q=barilla" "https://www.konzum.hr/web/search?q=barilla" "https://shop.billa.cz/vyhledavani?q=barilla" "https://www.kaufland.de/" "https://www.kaufland.ro/" "https://www.lidl.de/q/search?q=barilla" "https://www.auchan.ro/barilla?_q=barilla" "https://www.globus.de/" "https://www.mercator.si/" "https://www.tesco.hu/" "https://www.sklavenitis.gr/apotelesmata-anazitisis/?Query=barilla" "https://www.ab.gr/search?q=barilla"; do
            curl -sL -m 25 -A "$UA" -o p -w "## $u %{http_code} %{size_download}\n" "$u"; grep -oiE 'barilla[^<"]{0,40}' p | head -2
          done
