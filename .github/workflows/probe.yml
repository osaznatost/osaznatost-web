name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sIL https://data.opensanctions.org/datasets/latest/sanctions/targets.simple.csv | head -5
          curl -sL https://data.opensanctions.org/datasets/latest/sanctions/targets.simple.csv -o t.csv; ls -la t.csv; head -1 t.csv
          python3 -c "
          import csv,sys; csv.field_size_limit(10**9)
          r=csv.DictReader(open('t.csv')); n=0
          for x in r:
            if 'bg' in x['countries'].split(';'):
              n+=1
              if n<15: print(x['schema'],x['name'][:60],x['identifiers'][:80],x['sanctions'][:100])
          print('BG',n)"
