name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > r.mjs <<'X'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage({ userAgent: "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" });
          for (const s of ["devnya","suvorovo","beloslav"]) { try { await p.goto(`https://${s}.obs-savet.eu/`, { waitUntil: "networkidle", timeout: 45000 }); } catch {}
            const l = await p.$$eval("a", (as) => as.map((a) => decodeURI(a.getAttribute("href") || "")).filter((h) => h.startsWith("/obs/")));
            console.log("##", s, [...new Set(l)].join(" | ")); }
          await b.close();
          X
          node r.mjs
