name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" https://www.adfi.minfin.bg/ | grep -o 'href="[^"]*"' | sort -u | head -80
          echo "== zop"; curl -sL -A "$UA" https://www.adfi.minfin.bg/bg/zop | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 3000
