name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          curl -sL -A "$UA" -m 60 -o p.odt -w "GET %{http_code} %{size_download} %{content_type}\n" https://obs-silistra.com/wp-content/uploads/2026/11/protokol_45-29.10.2026.odt
          file p.odt
          unzip -p p.odt content.xml | sed 's#</text:p>#\n#g; s/<[^>]*>//g' > t.txt; wc -l t.txt
          grep -n -i -m6 -B2 -A8 "гласувал\|„за“\|поименно" t.txt | head -70 | sed 's/^/T /'
          grep -n -i -m5 "РЕШЕНИЕ №\|Решение №" t.txt | sed 's/^/R /'
