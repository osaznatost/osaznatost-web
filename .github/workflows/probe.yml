name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=https://www.balchik.bg/bg/mandat-2023-2027/resheniya-ot-zasedanie-na-obs-na-22102026-g
          curl -sL -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" "$u" > p.html; wc -c p.html
          grep -oiE 'href="[^"]+"[^>]*>[^<]{0,80}' p.html | grep -iE 'pdf|doc|upload|file|storage|resh' | head -20
          python3 -c "import re;t=open('p.html').read();i=t.find('Решени');print(re.sub(r'<[^>]+>',' ',t[i:i+3000]))" | tr -s ' \n' | head -c 2500
