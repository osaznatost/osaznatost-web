name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in beloslav devnya suvorovo valchidol; do echo "## $s"; curl -s -m 20 https://$s.obs-savet.eu/ | grep -oE 'href="/(obs|blog)/[^"]+"[^>]*>[^<]{0,60}' | python3 -c "import sys,urllib.parse;[print(urllib.parse.unquote(l.strip())[:160]) for l in sys.stdin]" | sort -u | head -15; done
