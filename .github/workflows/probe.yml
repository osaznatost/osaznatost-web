name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for h in maritsa.bg rodopi.bg dulovo.bg primorsko.bg obs.kostinbrod.bg; do
            echo "## $h"; curl -s -m 30 -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" "https://$h/wp-json/wp/v2/categories?per_page=100" | python3 -c "import json,sys
          try:
            [print('  C',c['id'],c['name'],c['count']) for c in json.load(sys.stdin) if c['count']>3]
          except Exception as e: print('  err',e)" | head -30
          done
          for u in https://www.isperih.bg/bg/meetings https://www.lukovit.bg/bg/obshtinski-savet https://www.tsarevo.bg/obshtinski-savet https://www.radnevo.bg/section-126-content.html; do echo "## $u"; curl -sL -m 30 -A "osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)" "$u" | grep -oiE 'href="[^"]+"[^>]*>[^<]{0,70}' | grep -iE 'реш|resh|reshen|pdf|zased|заседан|meeting' | sort -u | head -15; done
