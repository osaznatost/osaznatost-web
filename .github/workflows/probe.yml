name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://vidinobs.com/resheniq https://vidinobs.com/protokoli; do
            curl -sL -m 60 -A "$UA" -o p.html -w "## $u %{http_code} %{size_download} %{url_effective}\n" "$u"
            grep -o 'href="[^"]*"' p.html | sort -u | grep -iv "\.css\|\.js\|fonts\|#" | head -60 | sed 's/^/## /'
            python3 -c "
          import re,html;s=open('p.html',encoding='utf8',errors='ignore').read();t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S);t=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t)));print('## TEXT',t[:2500])"
          done
