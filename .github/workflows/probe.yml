name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in "https://provadia.bg/list.php?category_id=4" https://obs.septemvri.org/ https://aytos.bg/obshtinski-savet-153.html "https://www.obs.kostinbrod.bg/?s=%D1%80%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F"; do
            rm -f p.html; echo "## $u $(curl -sL -m 30 -o p.html -w '%{http_code}' -A "$UA" "$u")"
            grep -oiE 'href="[^"]+"[^>]*>[^<]{0,80}' p.html | grep -iE 'реш|resh|протокол|protokol|pdf|docx?|page|category_id=4|202[4-6]' | sort -u | head -25
          done
