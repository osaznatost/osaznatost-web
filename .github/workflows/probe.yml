name: Проба
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="osaznatost-bot/1.0 (+https://osaznatost.pavlin140.workers.dev)"
          for u in https://www.etropole.bg/bg/resheniya https://topolovgrad.bg/obs-reshenia/ https://rodopi.bg/obshtinski-savet/resheniya/ https://omurtag.bg/?page_id=412 https://tundzha.bg/obshtinski-savet/drugi-dokumenti/; do echo "## $u"; curl -sL -m 30 -A "$UA" "$u" | grep -oE 'href="[^"]+"[^>]*>[^<]{0,80}' | grep -viE 'facebook|\.css|favicon|wp-json|xmlrpc|feed' | grep -iE 'реш|resh|pdf|doc|page|202[3-6]|zased|protok' | sort -u | head -14; done
