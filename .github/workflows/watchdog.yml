name: Пазач на обновяванията
on:
  schedule:
    - cron: "53 7,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
