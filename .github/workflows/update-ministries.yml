name: Министерствата (Административен регистър)
on:
  schedule:
    - cron: "23 4 * * 1"   # всеки понеделник
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-ministries
  cancel-in-progress: false
jobs:
  ministries:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-ministries.mjs
      - name: Запис, ако има промяна
        run: |
          git add data/ministries.json
          if git diff --cached --quiet; then echo "Няма промяна"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Данни: министерствата (Административен регистър)"
          git pull --rebase
          git push
