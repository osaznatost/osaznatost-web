name: Декларации за интереси (КПК / Сметна палата)
# register.cacbg.bg отговаря само на български IP адреси: четенето върви на self-hosted runner в България (Mac),
# свързването с поръчките — в GitHub (нужен е достъп до базата).
on:
  # schedule (Cloudflare):
    # cf-cron: "37 2 * * *"   # всяка нощ; вече прочетените декларации се прескачат, четенето продължава откъдето е спряло
  workflow_dispatch:
    inputs:
      years:
        description: "Набори от регистъра (напр. 2026,2025y)"
        default: "2026,2025,2025y,2024,2024y,2024f1,2023,2023y,2023y2,2023y3,2023y4,2023f1,2022,2022y,2022f1,2021_nc,2021_nonc,2021y,2021f1,2020,2020y,2020f1"
      link_only:
        description: "Само свързване с поръчките (без четене от Mac-а)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: declarations
  cancel-in-progress: false
jobs:
  read:
    if: ${{ !inputs.link_only }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      # Mac-ът понякога е без мрежа за минута след събуждане — втори опит след пауза.
      - if: steps.co1.outcome == 'failure'
        run: sleep 90
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Четене на декларациите
        env:
          YEARS: ${{ inputs.years || '2026,2025,2025y,2024,2024y,2024f1,2023,2023y,2023y2,2023y3,2023y4,2023f1,2022,2022y,2022f1,2021_nc,2021_nonc,2021y,2021f1,2020,2020y,2020f1' }}
          MINUTES: "280"
        run: caffeinate -i -s node scripts/import-declarations.mjs   # Mac-ът да не заспи по време на четенето
      - name: Запис
        if: always()
        run: |
          git add data/declarations
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Декларации за интереси: обновяване"
          git pull --rebase -X theirs
          git push
  link:
    needs: read
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Свързване с обществените поръчки
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/build-declaration-links.mjs
      - name: Запис
        run: |
          git add data/declarations/links.json data/tr/priority.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Декларации: връзки с поръчките"
          git pull --rebase -X theirs
          git push
