name: Проекти (хората зад поръчките)

on:
  schedule:
    - cron: "33 5 * * *"   # всеки ден
  workflow_dispatch:
    inputs:
      max_back:
        description: "Дни история на едно пускане"
        default: "150"

permissions:
  contents: write

jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Лица за контакт и представители от обявленията (OCDS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_BACK: ${{ inputs.max_back || '150' }}
        run: node scripts/import-ocds-people.mjs
      - name: Запис, ако има промяна
        run: |
          git add data/projects
          if git diff --cached --quiet; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Данни: хората зад поръчките (OCDS)"
          git pull --rebase
          git push
