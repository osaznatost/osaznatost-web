name: Обновяване на статистиките

on:
  # schedule (Cloudflare):
    # cf-cron: "41 5 * * 2"   # всеки вторник
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/import-stats.mjs, scripts/import-local-elections.mjs]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Импорт от Евростат
        run: node scripts/import-stats.mjs
      - name: Местни данъци (ИПИ през „Наясно“)
        run: node scripts/import-local-taxes.mjs
        continue-on-error: true
      - name: Проучвания (през „Наясно“)
        run: node scripts/import-polls-trend.mjs
        continue-on-error: true
      - name: Местни избори 2011–2023 (ЦИК през „Наясно“)
        run: node scripts/import-local-elections.mjs
        continue-on-error: true
      - name: Запис, ако има промяна
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/stats.json data/local-taxes.json data/polls-trend.json data/local-elections.json
          git commit -m "Данни: обновени статистики, местни данъци и избори"
          git pull --rebase
          git push
