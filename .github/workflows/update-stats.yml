name: Обновяване на статистиките

on:
  schedule:
    - cron: "41 5 * * 2"   # всеки вторник
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/import-stats.mjs]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Импорт от Евростат
        run: node scripts/import-stats.mjs
      - name: Запис, ако има промяна
        run: |
          if git diff --quiet -- data/ && git ls-files --error-unmatch data/stats.json >/dev/null 2>&1; then echo "Няма нови данни"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Данни: обновени статистики от Евростат"
          git pull --rebase
          git push
