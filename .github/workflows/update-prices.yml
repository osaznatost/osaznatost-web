name: Цени в магазините (Колко струва)
on:
  schedule:
    - cron: "23 3 * * *"   # всеки ден; файлът за предходния ден излиза малко след полунощ
  workflow_dispatch:
    inputs:
      dates:
        description: "Дати (ГГГГ-ММ-ДД ...) или backfill"
        default: ""
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/import-prices.py ${{ inputs.dates }}
      - name: Запис
        run: |
          git add data/prices
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Цени в магазините: обновяване"
          git pull --rebase -X theirs
          git push
