name: Обновяване на плащанията (СЕБРА)
# data.egov.bg приема автоматизирани заявки само от български IP адреси, затова тази задача
# върви на self-hosted runner в България (твоят Mac: self-hosted, macOS, ARM64). Без такъв runner задачата просто чака.
on:
  # schedule (Cloudflare):
    # cf-cron: "17 6 20 1,4,7,10 *"   # веднъж на тримесечие, след публикуването на новото тримесечие
  workflow_dispatch:
    inputs:
      only_zip:
        description: "Проба: само описанието на ZIP ресурсите, без запис"
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-sebra
  cancel-in-progress: false

jobs:
  sebra:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      # Mac-ът понякога е без мрежа за минута след събуждане — втори опит след пауза.
      - if: steps.co1.outcome == 'failure'
        run: sleep 90
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Изтегляне от data.egov.bg
        env:
          ONLY_ZIP: ${{ inputs.only_zip || '0' }}
        run: caffeinate -i -s node scripts/fetch-sebra.mjs "$RUNNER_TEMP/sebra"
      - name: Обобщение
        if: ${{ inputs.only_zip != '1' }}
        run: python3 scripts/import-sebra.py "$RUNNER_TEMP/sebra"
      - name: Запис, ако има промяна
        if: ${{ inputs.only_zip != '1' }}
        run: |
          # Защита: не записваме, ако редовете намаляват с повече от 5% (знак, че файл не се е прочел).
          old=$(git show HEAD:data/payments/index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["rows"])')
          new=$(python3 -c 'import json;print(json.load(open("data/payments/index.json"))["rows"])')
          if [ "$new" -lt $((old * 95 / 100)) ]; then echo "Редовете паднаха от $old на $new — не записвам"; exit 1; fi
          git add data/payments
          if git diff --cached --quiet; then echo "Няма нови плащания"; exit 0; fi
          git config user.name "osaznatost-bot"
          git config user.email "osaznatost-bot@users.noreply.github.com"
          git commit -m "Данни: нови плащания от СЕБРА"
          git pull --rebase
          git push
